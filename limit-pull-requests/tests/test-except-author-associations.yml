name: Test except-author-associations with unsupported event
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      # Under the harness the event is always workflow_dispatch, so even with
      # exemption inputs set, the action must reject the event before any API call.
      - id: action
        uses: .
        continue-on-error: true
        with:
          except-users: some-user,another-user
          except-author-associations: OWNER,MEMBER,COLLABORATOR
          comment: "Too many open pull requests."
          comment-limit: "5"
      - name: Assert action rejected the unsupported event
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected failure for unsupported workflow_dispatch event"
            exit 1
          fi
          echo "PASS"
