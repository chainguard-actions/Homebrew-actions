name: Test except-author-associations input with unsupported event
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        continue-on-error: true
        with:
          except-users: "dependabot[bot]"
          except-author-associations: "MEMBER,OWNER,COLLABORATOR"
          comment: "You have too many open pull requests."
          comment-limit: "1"
      - name: Assert action rejected the non-pull_request event
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          # Event is always workflow_dispatch under the harness; the action
          # checks the event before any input-driven logic and must fail.
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected failure for unsupported event, got '$OUTCOME'"
            exit 1
          fi
          echo "PASS"
