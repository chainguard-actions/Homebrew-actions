name: Test unsupported event (default inputs)
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      # Under the harness the event is always workflow_dispatch; the action
      # only supports pull_request/pull_request_target and must call setFailed.
      - id: action
        uses: .
        continue-on-error: true
      - name: Assert action rejected the unsupported event
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected failure for workflow_dispatch event, got '$OUTCOME'"
            exit 1
          fi
          echo "PASS"
