name: Test unsupported event with close and comment configured
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        continue-on-error: true
        with:
          comment: "You have too many open pull requests."
          comment-limit: "0"
          close: "true"
          close-limit: "0"
          except-users: |
            someone-else
          except-author-associations: |
            MEMBER
      - name: Assert action rejected workflow_dispatch event before any API call
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected failure for unsupported event, got '$OUTCOME'"
            exit 1
          fi
          echo "PASS"
