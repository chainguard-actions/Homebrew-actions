name: Test unsupported event with close enabled is rejected without closing
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        continue-on-error: true
        with:
          close: "true"
          close-limit: "0"
          except-users: "someone-else"
      - name: Assert action rejected the non-pull_request event
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected failure for unsupported event, got '$OUTCOME'"
            exit 1
          fi
          echo "PASS"
