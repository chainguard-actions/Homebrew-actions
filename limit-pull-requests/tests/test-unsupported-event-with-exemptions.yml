name: Test unsupported event with exemption inputs
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        continue-on-error: true
        with:
          except-users: some-user
          except-author-associations: |
            OWNER
            MEMBER
          comment: Too many open pull requests
          comment-limit: "5"
      - name: Assert action rejects workflow_dispatch event despite exemptions
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          # The event check runs before any exemption handling; under act the
          # event is always workflow_dispatch, so the action must call setFailed.
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected failure for unsupported event, got '$OUTCOME'"
            exit 1
          fi
          echo "PASS"
