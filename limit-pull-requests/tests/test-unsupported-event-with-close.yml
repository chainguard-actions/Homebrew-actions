name: Test unsupported event with comment and close configured
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      # Even with comment/close configured, the event check runs first, so the
      # action must fail without commenting on or closing anything.
      - id: action
        uses: .
        continue-on-error: true
        with:
          comment-limit: "0"
          comment: "Too many open pull requests."
          close-limit: "0"
          close: "true"
          except-users: |
            someone-else
          except-author-associations: |
            MEMBER
      - name: Assert action rejected the unsupported event
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected failure for workflow_dispatch event, got '$OUTCOME'"
            exit 1
          fi
          echo "PASS"
