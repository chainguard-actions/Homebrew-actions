name: Test unsupported event rejected even with comment and close enabled
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      # Even with comment/close configured and limits of 0, the event check
      # happens first, so the action must fail without commenting/closing.
      - id: action
        uses: .
        continue-on-error: true
        with:
          comment: "You have too many open pull requests."
          comment-limit: "0"
          close: "true"
          close-limit: "0"
          except-users: |
            someone-else
      - name: Assert action rejected the unsupported event
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected failure for unsupported workflow_dispatch event"
            exit 1
          fi
          echo "PASS"
