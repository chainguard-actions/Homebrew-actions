name: Test staged files against sentinel repository
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Create a separate git repository with staged changes
        run: |
          rm -rf "$RUNNER_TEMP/staged-repo"
          mkdir -p "$RUNNER_TEMP/staged-repo"
          cd "$RUNNER_TEMP/staged-repo"
          git init -q
          git config user.email "test@example.com"
          git config user.name "Test User"
          echo "hello" > README.md
          echo "remove me" > old.txt
          git add README.md old.txt
          git commit -q -m "initial"
          echo "new content" > new-file.txt
          git add new-file.txt
          git rm -q old.txt
          STAGED="$(git diff --cached --name-only)"
          echo "staged: $STAGED"
          echo "$STAGED" | grep -qx "new-file.txt" || { echo "FAIL: setup did not stage new-file.txt"; exit 1; }
          echo "$STAGED" | grep -qx "old.txt" || { echo "FAIL: setup did not stage deletion of old.txt"; exit 1; }
      - id: action
        uses: .
        continue-on-error: true
        with:
          message: "test commit from act harness"
          branch: act-harness-test-branch
          token: ${{ secrets.GITHUB_TOKEN }}
          directory: ${{ runner.temp }}/staged-repo
      - name: Assert action ran (succeeded, or failed gracefully on the sentinel repo)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "success" ]; then
            echo "PASS: action pushed the commit"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (sentinel repo is not resolvable)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
      - name: Assert local repository was not modified by the action
        run: |
          cd "$RUNNER_TEMP/staged-repo"
          STAGED="$(git diff --cached --name-only)"
          echo "staged after action: $STAGED"
          echo "$STAGED" | grep -qx "new-file.txt" || { echo "FAIL: staged changes were lost"; exit 1; }
          echo "PASS"
