name: Test no staged changes fails
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Ensure nothing is staged
        run: |
          git reset -q || true
          STAGED="$(git diff --cached --name-only)"
          echo "staged: '$STAGED'"
          if [ -n "$STAGED" ]; then
            echo "FAIL: precondition - index should be clean"
            exit 1
          fi
      - id: action
        uses: .
        continue-on-error: true
        with:
          message: "test commit"
          branch: actionchain-test-nonexistent-branch
          token: ${{ github.token }}
      - name: Assert action failed (No files to commit)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected failure when nothing is staged"
            exit 1
          fi
          echo "PASS"
