name: Test no staged files fails
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Ensure nothing is staged
        run: |
          git reset -q || true
          if [ -n "$(git diff --cached --name-only)" ]; then
            echo "FAIL: index still has staged changes"
            exit 1
          fi
      - id: action
        uses: .
        continue-on-error: true
        with:
          message: "test commit"
          branch: act-harness-test
          token: ${{ github.token }}
      - name: Assert action failed with nothing to commit
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected failure when no files are staged"
            exit 1
          fi
          echo "PASS"
