name: Test no staged files fails
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Ensure nothing is staged in the workspace
        run: |
          git reset -q || true
          STAGED="$(git diff --cached --name-only)"
          echo "staged: '$STAGED'"
          if [ -n "$STAGED" ]; then
            echo "FAIL: expected no staged files before running action"
            exit 1
          fi
      - id: action
        uses: .
        continue-on-error: true
        with:
          message: "test commit"
          branch: act-harness-test-branch
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Assert action failed due to no files to commit
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected failure when there is nothing staged"
            exit 1
          fi
          echo "PASS"
