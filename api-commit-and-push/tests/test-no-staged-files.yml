name: Test no staged files fails
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Create a clean local repo with nothing staged
        run: |
          set -e
          dir="$RUNNER_TEMP/clean-repo"
          rm -rf "$dir"
          mkdir -p "$dir"
          cd "$dir"
          git init -q
          git config user.email "test@example.com"
          git config user.name "Test User"
          echo hello > README.md
          git add README.md
          git commit -q -m "initial"
          git status
      - id: action
        uses: .
        continue-on-error: true
        with:
          message: "test commit"
          branch: test-branch
          token: ${{ github.token }}
          directory: ${{ runner.temp }}/clean-repo
      - name: Assert action failed with nothing to commit
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected failure when no files are staged"
            exit 1
          fi
          echo "PASS"
