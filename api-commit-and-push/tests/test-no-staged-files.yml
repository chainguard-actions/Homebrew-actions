name: Test no staged files fails
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Create a clean local repo with nothing staged
        run: |
          set -e
          DIR="$RUNNER_TEMP/clean-repo"
          rm -rf "$DIR"
          mkdir -p "$DIR"
          cd "$DIR"
          git init -q
          git config user.email "test@example.com"
          git config user.name "Test User"
          echo "hello" > README.md
          git add README.md
          git commit -q -m "initial"
          # Unstaged modification only; must not be picked up
          echo "changed" >> README.md
          git diff --cached --name-only
          echo "REPO_DIR=$DIR" >> "$GITHUB_ENV"
      - id: action
        uses: .
        continue-on-error: true
        with:
          message: "test commit"
          branch: "act-test-nonexistent-branch"
          token: ${{ github.token }}
          directory: ${{ env.REPO_DIR }}
          repository: actionchain-harness/nonexistent-repo-for-testing
      - name: Assert action failed (No files to commit)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected failure when nothing is staged"
            exit 1
          fi
          echo "PASS"
      - name: Assert local repo untouched
        run: |
          cd "$REPO_DIR"
          COUNT="$(git rev-list --count HEAD)"
          echo "commits: $COUNT"
          if [ "$COUNT" != "1" ]; then
            echo "FAIL: expected exactly 1 commit"
            exit 1
          fi
          echo "PASS"
