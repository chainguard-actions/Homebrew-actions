name: Test custom directory with nothing staged
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Create a separate clean repository
        run: |
          set -e
          DIR="$RUNNER_TEMP/clean-repo"
          rm -rf "$DIR"
          mkdir -p "$DIR"
          cd "$DIR"
          git init -q
          git config user.email "test@example.com"
          git config user.name "Test User"
          echo "initial" > README.txt
          git add README.txt
          git commit -q -m "initial"
          echo "dir=$DIR" >> "$GITHUB_OUTPUT"
        id: setup
      - id: action
        uses: .
        continue-on-error: true
        with:
          message: "test commit"
          branch: actionchain-test-nonexistent-branch
          token: ${{ github.token }}
          directory: ${{ steps.setup.outputs.dir }}
      - name: Assert action failed (No files to commit in custom directory)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected failure when nothing is staged in directory"
            exit 1
          fi
          echo "PASS"
