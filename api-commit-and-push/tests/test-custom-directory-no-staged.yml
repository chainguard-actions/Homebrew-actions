name: Test custom directory with nothing staged
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Create a separate local repo with a clean index
        run: |
          rm -rf "$RUNNER_TEMP/sub-repo"
          mkdir -p "$RUNNER_TEMP/sub-repo"
          cd "$RUNNER_TEMP/sub-repo"
          git init -q
          git config user.email "test@example.com"
          git config user.name "Test User"
          echo "hello" > file.txt
          git add file.txt
          git commit -q -m "initial"
          # Unstaged modification only - must not be picked up
          echo "changed" > file.txt
      - id: action
        uses: .
        continue-on-error: true
        with:
          message: "test commit"
          branch: act-harness-test
          token: ${{ github.token }}
          directory: ${{ runner.temp }}/sub-repo
      - name: Assert action failed (unstaged changes are not committed)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected failure since nothing is staged in the custom directory"
            exit 1
          fi
          echo "PASS"
