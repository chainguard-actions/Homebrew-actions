name: Test custom directory with no staged files fails
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Create a separate clean git repository
        run: |
          rm -rf "$RUNNER_TEMP/clean-repo"
          mkdir -p "$RUNNER_TEMP/clean-repo"
          cd "$RUNNER_TEMP/clean-repo"
          git init -q
          echo "hello" > README.md
          git add README.md
          git -c user.email=test@example.com -c user.name="Test User" commit -q -m "initial"
          if [ -n "$(git diff --cached --name-only)" ]; then
            echo "FAIL: precondition - index not clean"
            exit 1
          fi
          echo "PASS: clean repo prepared"
      - id: action
        uses: .
        continue-on-error: true
        with:
          message: "test commit"
          branch: act-harness-test-branch
          token: ${{ github.token }}
          directory: ${{ runner.temp }}/clean-repo
      - name: Assert action failed with no files to commit
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected failure when no files are staged in directory"
            exit 1
          fi
          echo "PASS"
