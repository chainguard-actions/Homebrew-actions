name: Test staged file commit via API
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Create local repo with a staged change
        run: |
          set -e
          dir="$RUNNER_TEMP/staged-repo"
          rm -rf "$dir"
          mkdir -p "$dir"
          cd "$dir"
          git init -q
          git config user.email "test@example.com"
          git config user.name "Test User"
          echo hello > README.md
          git add README.md
          git commit -q -m "initial"
          mkdir -p sub/dir
          echo "new content" > sub/dir/file.txt
          echo "changed" > README.md
          git add -A
          git diff --cached --name-only
      - id: action
        uses: .
        continue-on-error: true
        with:
          message: "test commit"
          branch: actionchain-test-branch-does-not-exist
          token: ${{ github.token }}
          directory: ${{ runner.temp }}/staged-repo
      - name: Assert action ran (succeeded, or failed gracefully on the sentinel repo)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "success" ]; then
            echo "PASS: action pushed via API"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (sentinel repo is not resolvable)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
      - name: Assert local repo index was not modified
        run: |
          cd "$RUNNER_TEMP/staged-repo"
          files="$(git diff --cached --name-only | sort | tr '\n' ' ')"
          echo "staged: $files"
          if [ "$files" != "README.md sub/dir/file.txt " ]; then
            echo "FAIL: staged files changed unexpectedly"
            exit 1
          fi
          echo "PASS"
