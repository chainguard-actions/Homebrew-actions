name: Test staged deletion commit via API
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Create local repo with a staged deletion
        run: |
          set -e
          dir="$RUNNER_TEMP/delete-repo"
          rm -rf "$dir"
          mkdir -p "$dir"
          cd "$dir"
          git init -q
          git config user.email "test@example.com"
          git config user.name "Test User"
          echo keep > keep.txt
          echo bye > remove.txt
          git add .
          git commit -q -m "initial"
          git rm -q remove.txt
          git diff --cached --name-status
      - id: action
        uses: .
        continue-on-error: true
        with:
          message: "delete a file"
          branch: actionchain-test-branch-does-not-exist
          token: ${{ github.token }}
          directory: ${{ runner.temp }}/delete-repo
      - name: Assert action ran (succeeded, or failed gracefully on the sentinel repo)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "success" ]; then
            echo "PASS: action pushed via API"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (sentinel repo is not resolvable)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
