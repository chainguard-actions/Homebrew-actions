name: Test custom directory with nothing staged
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Create a separate clean git repository
        run: |
          rm -rf "$RUNNER_TEMP/clean-repo"
          mkdir -p "$RUNNER_TEMP/clean-repo"
          cd "$RUNNER_TEMP/clean-repo"
          git init -q
          git config user.email "test@example.com"
          git config user.name "Test User"
          echo "hello" > README.md
          git add README.md
          git commit -q -m "initial"
          # An unstaged modification must not count as something to commit
          echo "modified" >> README.md
          echo "untracked" > untracked.txt
          echo "staged: '$(git diff --cached --name-only)'"
      - id: action
        uses: .
        continue-on-error: true
        with:
          message: "test commit"
          branch: act-harness-test-branch
          token: ${{ secrets.GITHUB_TOKEN }}
          directory: ${{ runner.temp }}/clean-repo
      - name: Assert action failed because nothing was staged
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected failure when only unstaged/untracked changes exist"
            exit 1
          fi
          echo "PASS"
