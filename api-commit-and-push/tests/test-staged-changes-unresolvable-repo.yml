name: Test staged changes against unresolvable repository
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Create local repo with staged changes (add, nested, delete)
        run: |
          set -e
          DIR="$RUNNER_TEMP/staged-repo"
          rm -rf "$DIR"
          mkdir -p "$DIR"
          cd "$DIR"
          git init -q
          git config user.email "test@example.com"
          git config user.name "Test User"
          echo "hello" > README.md
          echo "remove me" > old.txt
          git add README.md old.txt
          git commit -q -m "initial"
          mkdir -p sub/dir
          echo "nested" > sub/dir/file.txt
          echo "updated" >> README.md
          git rm -q old.txt
          git add README.md sub/dir/file.txt
          echo "staged:"
          git diff --cached --name-only
          echo "REPO_DIR=$DIR" >> "$GITHUB_ENV"
          echo "HEAD_BEFORE=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
      - id: action
        uses: .
        continue-on-error: true
        with:
          message: "test commit from act"
          branch: "act-test-nonexistent-branch"
          token: ${{ github.token }}
          directory: ${{ env.REPO_DIR }}
          repository: actionchain-harness/nonexistent-repo-for-testing
      - name: Assert action failed gracefully on the nonexistent repository
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "failure" ]; then
            echo "PASS: API calls to nonexistent repo failed as expected"
          elif [ "$OUTCOME" = "success" ]; then
            echo "FAIL: action unexpectedly succeeded against a nonexistent repository"
            exit 1
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
      - name: Assert local repo HEAD and index unchanged
        run: |
          cd "$REPO_DIR"
          HEAD_NOW="$(git rev-parse HEAD)"
          echo "before: $HEAD_BEFORE now: $HEAD_NOW"
          if [ "$HEAD_NOW" != "$HEAD_BEFORE" ]; then
            echo "FAIL: local HEAD changed"
            exit 1
          fi
          STAGED="$(git diff --cached --name-only | sort | tr '\n' ' ')"
          echo "staged: $STAGED"
          if [ "$STAGED" != "README.md old.txt sub/dir/file.txt " ]; then
            echo "FAIL: staged files changed"
            exit 1
          fi
          echo "PASS"
