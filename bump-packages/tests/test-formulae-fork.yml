name: Test formulae bump with fork
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Set up mock brew and deprecation stub
        run: |
          mkdir -p "$RUNNER_TEMP/mockbin"
          cat > "$RUNNER_TEMP/mockbin/brew" <<'EOF'
          #!/bin/sh
          printf "%s\n" "$@" >> "$BREW_LOG"
          EOF
          chmod +x "$RUNNER_TEMP/mockbin/brew"
          echo "$RUNNER_TEMP/mockbin" >> "$GITHUB_PATH"
          echo "BREW_LOG=$RUNNER_TEMP/brew.log" >> "$GITHUB_ENV"
          rm -f "$RUNNER_TEMP/brew.log"
          if [ ! -f "$GITHUB_WORKSPACE/../deprecate-master.sh" ]; then
            printf '#!/bin/sh\nexit 0\n' > "$GITHUB_WORKSPACE/../deprecate-master.sh" || true
            chmod +x "$GITHUB_WORKSPACE/../deprecate-master.sh" || true
          fi
      - id: action
        uses: .
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          formulae: foo
          fork: "true"
      - name: Assert brew args
        run: |
          ACTUAL="$(cat "$BREW_LOG" | tr '\n' ' ')"
          echo "actual: $ACTUAL"
          if [ "$ACTUAL" != "bump --open-pr --formulae foo " ]; then
            echo "FAIL: unexpected brew args"
            exit 1
          fi
          echo "PASS"
