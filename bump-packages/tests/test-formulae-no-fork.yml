name: Test bump formulae without fork
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Set up fake brew and deprecation script stub
        run: |
          set -e
          FAKE_BIN="$RUNNER_TEMP/fake-bin"
          mkdir -p "$FAKE_BIN"
          cat > "$FAKE_BIN/brew" <<'EOF'
          #!/bin/bash
          echo "$*" >> "$RUNNER_TEMP/brew-calls.log"
          echo "HOMEBREW_DEVELOPER=$HOMEBREW_DEVELOPER" >> "$RUNNER_TEMP/brew-env.log"
          if [ -n "$HOMEBREW_GITHUB_API_TOKEN" ]; then echo "TOKEN=set" >> "$RUNNER_TEMP/brew-env.log"; fi
          exit 0
          EOF
          chmod +x "$FAKE_BIN/brew"
          echo "$FAKE_BIN" >> "$GITHUB_PATH"
          rm -f "$RUNNER_TEMP/brew-calls.log" "$RUNNER_TEMP/brew-env.log"
          STUB="$(dirname "$GITHUB_WORKSPACE")/deprecate-master.sh"
          if [ ! -e "$STUB" ]; then
            printf '#!/bin/bash\nexit 0\n' > "$STUB" 2>/dev/null || \
              printf '#!/bin/bash\nexit 0\n' | sudo tee "$STUB" >/dev/null
            chmod +x "$STUB" 2>/dev/null || sudo chmod +x "$STUB"
          fi
      - id: action
        uses: .
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          formulae: wget curl
          fork: 'false'
      - name: Assert brew bump invoked with expected args
        run: |
          echo "--- brew calls ---"
          cat "$RUNNER_TEMP/brew-calls.log" || true
          echo "--- brew env ---"
          cat "$RUNNER_TEMP/brew-env.log" || true
          EXPECTED="bump --no-fork --open-pr --formulae wget curl"
          ACTUAL="$(cat "$RUNNER_TEMP/brew-calls.log")"
          if [ "$ACTUAL" != "$EXPECTED" ]; then
            echo "FAIL: expected '$EXPECTED' got '$ACTUAL'"
            exit 1
          fi
          if ! grep -q '^HOMEBREW_DEVELOPER=1$' "$RUNNER_TEMP/brew-env.log"; then
            echo "FAIL: HOMEBREW_DEVELOPER not set to 1"
            exit 1
          fi
          if ! grep -q '^TOKEN=set$' "$RUNNER_TEMP/brew-env.log"; then
            echo "FAIL: HOMEBREW_GITHUB_API_TOKEN not passed"
            exit 1
          fi
          echo "PASS"
