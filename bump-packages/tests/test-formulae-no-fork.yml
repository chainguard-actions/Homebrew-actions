name: Test bump formulae without fork
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Set up mock brew and deprecation script
        run: |
          mkdir -p /tmp/brew-mock/bin
          rm -f /tmp/brew-mock/brew.log /tmp/brew-mock/env.log
          cat > /tmp/brew-mock/bin/brew <<'EOF'
          #!/bin/bash
          echo "$*" >> /tmp/brew-mock/brew.log
          echo "dev=${HOMEBREW_DEVELOPER} token_set=${HOMEBREW_GITHUB_API_TOKEN:+yes}" >> /tmp/brew-mock/env.log
          EOF
          chmod +x /tmp/brew-mock/bin/brew
          echo "/tmp/brew-mock/bin" >> "$GITHUB_PATH"
          if [ ! -f "$GITHUB_WORKSPACE/../deprecate-master.sh" ]; then
            printf '#!/bin/bash\nexit 0\n' > "$GITHUB_WORKSPACE/../deprecate-master.sh"
            chmod +x "$GITHUB_WORKSPACE/../deprecate-master.sh"
          fi
      - id: action
        uses: .
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          formulae: foo bar
          fork: "false"
      - name: Assert brew bump called with --no-fork
        run: |
          echo "brew.log:"; cat /tmp/brew-mock/brew.log || true
          echo "env.log:"; cat /tmp/brew-mock/env.log || true
          EXPECTED="bump --no-fork --open-pr --formulae foo bar"
          ACTUAL="$(cat /tmp/brew-mock/brew.log)"
          if [ "$ACTUAL" != "$EXPECTED" ]; then
            echo "FAIL: expected '$EXPECTED', got '$ACTUAL'"
            exit 1
          fi
          if ! grep -q "dev=1 token_set=yes" /tmp/brew-mock/env.log; then
            echo "FAIL: HOMEBREW_DEVELOPER / HOMEBREW_GITHUB_API_TOKEN not set"
            exit 1
          fi
          echo "PASS"
