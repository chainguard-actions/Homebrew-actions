name: Test formulae and casks together
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Set up mock brew and deprecation script
        run: |
          set -e
          DEP="$GITHUB_WORKSPACE/../deprecate-master.sh"
          if [ ! -f "$DEP" ]; then
            printf '#!/bin/sh\necho "deprecation check: $*"\n' > "$DEP"
            chmod +x "$DEP"
          fi
          mkdir -p /tmp/mockbin
          cat > /tmp/mockbin/brew <<'EOF'
          #!/bin/bash
          {
            printf 'ARGS:'
            printf ' %s' "$@"
            printf '\n'
          } >> /tmp/brew.log
          EOF
          chmod +x /tmp/mockbin/brew
          rm -f /tmp/brew.log
          echo "/tmp/mockbin" >> "$GITHUB_PATH"
      - id: action
        uses: .
        with:
          token: ${{ github.token }}
          formulae: foo
          casks: user/tap/baz
          fork: "false"
      - name: Assert brew invoked for both
        run: |
          cat /tmp/brew.log || { echo "FAIL: brew not invoked"; exit 1; }
          COUNT="$(grep -c '^ARGS:' /tmp/brew.log)"
          echo "invocations: $COUNT"
          [ "$COUNT" = "2" ] || { echo "FAIL: expected 2 invocations"; exit 1; }
          grep -qx 'ARGS: bump --no-fork --open-pr --formulae foo' /tmp/brew.log || { echo "FAIL: formulae call missing"; exit 1; }
          grep -qx 'ARGS: bump --no-fork --full-name --open-pr --casks user/tap/baz' /tmp/brew.log || { echo "FAIL: casks call missing"; exit 1; }
          echo "PASS"
