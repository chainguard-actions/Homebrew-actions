name: Test bump formulae and fully-qualified casks together
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Set up mock brew and deprecation script
        run: |
          mkdir -p /tmp/brew-mock/bin
          rm -f /tmp/brew-mock/brew.log
          cat > /tmp/brew-mock/bin/brew <<'EOF'
          #!/bin/bash
          echo "$*" >> /tmp/brew-mock/brew.log
          EOF
          chmod +x /tmp/brew-mock/bin/brew
          echo "/tmp/brew-mock/bin" >> "$GITHUB_PATH"
          if [ ! -f "$GITHUB_WORKSPACE/../deprecate-master.sh" ]; then
            printf '#!/bin/bash\nexit 0\n' > "$GITHUB_WORKSPACE/../deprecate-master.sh"
            chmod +x "$GITHUB_WORKSPACE/../deprecate-master.sh"
          fi
      - id: action
        uses: .
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          formulae: foo
          casks: user/tap/baz
          fork: "false"
      - name: Assert both bump invocations
        run: |
          cat /tmp/brew-mock/brew.log || true
          EXPECTED="$(printf '%s\n%s' 'bump --no-fork --open-pr --formulae foo' 'bump --no-fork --full-name --open-pr --casks user/tap/baz')"
          ACTUAL="$(cat /tmp/brew-mock/brew.log)"
          if [ "$ACTUAL" != "$EXPECTED" ]; then
            echo "FAIL: expected:"; echo "$EXPECTED"
            exit 1
          fi
          echo "PASS"
