name: Test formulae and casks together
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Ensure sibling deprecate-master.sh exists and mock brew
        run: |
          if [ ! -f "$GITHUB_WORKSPACE/../deprecate-master.sh" ]; then
            printf '#!/bin/sh\necho "deprecate-master stub: $*"\n' > "$GITHUB_WORKSPACE/../deprecate-master.sh"
            chmod +x "$GITHUB_WORKSPACE/../deprecate-master.sh"
          fi
          mkdir -p "$RUNNER_TEMP/fakebin"
          cat > "$RUNNER_TEMP/fakebin/brew" <<'EOF'
          #!/bin/bash
          echo "$*" >> "$RUNNER_TEMP/brew-calls.log"
          EOF
          chmod +x "$RUNNER_TEMP/fakebin/brew"
          echo "$RUNNER_TEMP/fakebin" >> "$GITHUB_PATH"
      - id: action
        uses: .
        with:
          token: ${{ github.token }}
          formulae: git
          casks: homebrew/cask/iterm2
          fork: 'false'
      - name: Assert both bumps called in order
        run: |
          cat "$RUNNER_TEMP/brew-calls.log" || { echo "FAIL: brew not called"; exit 1; }
          FIRST=$(sed -n 1p "$RUNNER_TEMP/brew-calls.log")
          SECOND=$(sed -n 2p "$RUNNER_TEMP/brew-calls.log")
          if [ "$FIRST" != "bump --no-fork --open-pr --formulae git" ]; then
            echo "FAIL: unexpected formulae call '$FIRST'"; exit 1
          fi
          if [ "$SECOND" != "bump --no-fork --full-name --open-pr --casks homebrew/cask/iterm2" ]; then
            echo "FAIL: unexpected casks call '$SECOND'"; exit 1
          fi
          echo "PASS"
