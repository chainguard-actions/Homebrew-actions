name: Test formulae and casks bumped together
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Set up mock brew and deprecation stub
        run: |
          mkdir -p "$RUNNER_TEMP/mockbin"
          cat > "$RUNNER_TEMP/mockbin/brew" <<'EOF'
          #!/bin/sh
          echo "$*" >> "$BREW_LOG"
          EOF
          chmod +x "$RUNNER_TEMP/mockbin/brew"
          echo "$RUNNER_TEMP/mockbin" >> "$GITHUB_PATH"
          echo "BREW_LOG=$RUNNER_TEMP/brew.log" >> "$GITHUB_ENV"
          rm -f "$RUNNER_TEMP/brew.log"
          if [ ! -f "$GITHUB_WORKSPACE/../deprecate-master.sh" ]; then
            printf '#!/bin/sh\nexit 0\n' > "$GITHUB_WORKSPACE/../deprecate-master.sh" || true
            chmod +x "$GITHUB_WORKSPACE/../deprecate-master.sh" || true
          fi
      - id: action
        uses: .
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          formulae: foo
          casks: bar
          fork: "false"
      - name: Assert brew called twice with correct args
        run: |
          cat "$BREW_LOG"
          LINE1="$(sed -n 1p "$BREW_LOG")"
          LINE2="$(sed -n 2p "$BREW_LOG")"
          COUNT="$(wc -l < "$BREW_LOG")"
          if [ "$COUNT" -ne 2 ]; then echo "FAIL: expected 2 calls, got $COUNT"; exit 1; fi
          if [ "$LINE1" != "bump --no-fork --open-pr --formulae foo" ]; then echo "FAIL: formulae call '$LINE1'"; exit 1; fi
          if [ "$LINE2" != "bump --no-fork --open-pr --casks bar" ]; then echo "FAIL: casks call '$LINE2'"; exit 1; fi
          echo "PASS"
