name: Test formulae with default fork
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Ensure sibling deprecate-master.sh exists and mock brew
        run: |
          if [ ! -f "$GITHUB_WORKSPACE/../deprecate-master.sh" ]; then
            printf '#!/bin/sh\necho "deprecate-master stub: $*"\n' > "$GITHUB_WORKSPACE/../deprecate-master.sh"
            chmod +x "$GITHUB_WORKSPACE/../deprecate-master.sh"
          fi
          mkdir -p "$RUNNER_TEMP/fakebin"
          cat > "$RUNNER_TEMP/fakebin/brew" <<'EOF'
          #!/bin/bash
          echo "$*" >> "$RUNNER_TEMP/brew-calls.log"
          echo "DEV=$HOMEBREW_DEVELOPER TOKEN_SET=$([ -n "$HOMEBREW_GITHUB_API_TOKEN" ] && echo yes || echo no)" >> "$RUNNER_TEMP/brew-env.log"
          EOF
          chmod +x "$RUNNER_TEMP/fakebin/brew"
          echo "$RUNNER_TEMP/fakebin" >> "$GITHUB_PATH"
      - id: action
        uses: .
        with:
          token: ${{ github.token }}
          formulae: wget curl
      - name: Assert brew bump called correctly
        run: |
          cat "$RUNNER_TEMP/brew-calls.log" || { echo "FAIL: brew not called"; exit 1; }
          cat "$RUNNER_TEMP/brew-env.log"
          LINES=$(wc -l < "$RUNNER_TEMP/brew-calls.log")
          if [ "$LINES" -ne 1 ]; then echo "FAIL: expected 1 call, got $LINES"; exit 1; fi
          CALL=$(cat "$RUNNER_TEMP/brew-calls.log")
          # Owner is not Homebrew, so fork defaults to true => no --no-fork
          if [ "$CALL" != "bump --open-pr --formulae wget curl" ]; then
            echo "FAIL: unexpected call '$CALL'"
            exit 1
          fi
          if ! grep -q "DEV=1 TOKEN_SET=yes" "$RUNNER_TEMP/brew-env.log"; then
            echo "FAIL: env not set correctly"
            exit 1
          fi
          echo "PASS"
