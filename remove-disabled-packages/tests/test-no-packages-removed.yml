name: Test nothing removed when no formula is disabled long enough
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      GIT_AUTHOR_NAME: BrewTestBot
      GIT_AUTHOR_EMAIL: brew-test-bot@brew.sh
      GIT_COMMITTER_NAME: BrewTestBot
      GIT_COMMITTER_EMAIL: brew-test-bot@brew.sh
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Set up fake brew, Ruby and tap
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: bash "$GITHUB_WORKSPACE/tests/fixtures/setup-fake-brew.sh"
      - name: Populate tap
        run: |
          set -euo pipefail
          cd "$RDP_BASE/tap"
          printf '# recent\n  disable! date: "2000-01-01", because: :unmaintained\n' > Formula/recent.rb
          printf '# foreign\n  disable! date: "2000-01-01", because: :unmaintained\n' > Formula/foreign.rb
          printf '# active\n  disable! date: "2000-01-01", because: :unmaintained\n' > Formula/active.rb
          git add --all
          git commit --quiet -m "Add fixtures"
          OLD="$(date -d '13 months ago' +%F)"
          RECENT="$(date -d '2 months ago' +%F)"
          cat > "$RDP_BASE/formulae.json" <<EOF
          {"formulae":[
            {"name":"recent","tap":"$RDP_TAP","disabled":true,"disable_date":"$RECENT","ruby_source_path":"Formula/recent.rb"},
            {"name":"foreign","tap":"someone/else","disabled":true,"disable_date":"$OLD","ruby_source_path":"Formula/foreign.rb"},
            {"name":"active","tap":"$RDP_TAP","disabled":false,"disable_date":"$OLD","ruby_source_path":"Formula/active.rb"}
          ]}
          EOF
          cat "$RDP_BASE/formulae.json"
      # The shipped action.yml has a malformed "uses: $/setup-ruby" step that act
      # rejects, which marks the composite step failed even though main.rb
      # runs and sets its outputs. Tolerate that and assert on the real effects.
      - id: action
        uses: .
        continue-on-error: true
      - name: Assert action step ran
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "success" ] && [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
          echo "PASS"
      - name: Assert packages-removed is false
        env:
          ACTUAL: ${{ steps.action.outputs.packages-removed }}
        run: |
          echo "actual: $ACTUAL"
          if [ "$ACTUAL" != "false" ]; then
            echo "FAIL: expected 'false'"
            exit 1
          fi
          echo "PASS"
      - name: Assert partially-disabled-packages is empty
        env:
          ACTUAL: ${{ steps.action.outputs.partially-disabled-packages }}
        run: |
          echo "actual: '$ACTUAL'"
          if [ -n "$ACTUAL" ]; then
            echo "FAIL: expected empty"
            exit 1
          fi
          echo "PASS"
      - name: Assert all files kept and no new commits
        run: |
          cd "$RDP_BASE/tap"
          git log --format=%s
          for f in recent foreign active; do
            if [ ! -e "Formula/$f.rb" ]; then echo "FAIL: $f.rb was removed"; exit 1; fi
          done
          if [ "$(git rev-list --count HEAD)" != "1" ]; then
            echo "FAIL: expected no new commits"
            exit 1
          fi
          echo "PASS"
