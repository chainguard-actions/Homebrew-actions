name: Test no packages removed when none are old enough
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Provision Ruby >= 3.1 (act skips the action's setup-ruby step)
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: bash "$GITHUB_WORKSPACE/tests/fixtures/setup-modern-ruby.sh"
      - name: Set up fake brew and tap
        run: bash "$GITHUB_WORKSPACE/tests/fixtures/setup-fake-brew.sh" Formula
      - name: Populate tap fixtures
        run: |
          RECENT="$(date -d '3 months ago' +%F)"
          echo "# recent" > "$TAP_DIR/Formula/recent.rb"
          echo "# active" > "$TAP_DIR/Formula/active.rb"
          cat > "$FAKE_ROOT/formulae.json" <<EOF
          {"formulae":[
            {"name":"recent","tap":"$TARGET_TAP","disabled":true,"disable_date":"$RECENT","ruby_source_path":"Formula/recent.rb"},
            {"name":"active","tap":"$TARGET_TAP","disabled":false,"ruby_source_path":"Formula/active.rb"}
          ]}
          EOF
          git -C "$TAP_DIR" add --all
          git -C "$TAP_DIR" commit --quiet -m "Add fixtures"
      # act cannot resolve the action's internal `$/setup-ruby` reference and
      # marks the composite step failed even when main.rb succeeds, so the
      # outcome itself is not asserted strictly; the output and tap state are.
      - id: action
        uses: .
        continue-on-error: true
      - name: Assert step ran and packages-removed is false
        env:
          ACTUAL: ${{ steps.action.outputs.packages-removed }}
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          echo "actual: $ACTUAL"
          if [ "$OUTCOME" != "success" ] && [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: unexpected outcome '$OUTCOME'"; exit 1
          fi
          if [ "$ACTUAL" != "false" ]; then
            echo "FAIL: expected 'false'"
            exit 1
          fi
          echo "PASS"
      - name: Assert tap unchanged
        run: |
          for f in recent active; do
            if [ ! -f "$TAP_DIR/Formula/$f.rb" ]; then
              echo "FAIL: $f.rb should have been kept"; exit 1
            fi
          done
          COUNT="$(git -C "$TAP_DIR" rev-list --count HEAD)"
          echo "commit count: $COUNT"
          if [ "$COUNT" != "1" ]; then
            echo "FAIL: no new commits expected"; exit 1
          fi
          echo "PASS"
