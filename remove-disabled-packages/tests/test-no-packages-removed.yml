name: Test no packages removed when none are eligible
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      GIT_AUTHOR_NAME: BrewTestBot
      GIT_AUTHOR_EMAIL: brew-test-bot@brew.sh
      GIT_COMMITTER_NAME: BrewTestBot
      GIT_COMMITTER_EMAIL: brew-test-bot@brew.sh
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Ensure Ruby >= 3.1 is available
        run: |
          set -e
          ruby_ok() {
            command -v ruby >/dev/null 2>&1 && ruby -e 'exit(Gem::Version.new(RUBY_VERSION) >= Gem::Version.new("3.1") ? 0 : 1)'
          }
          if ruby_ok; then ruby --version; exit 0; fi
          SUDO=""; [ "$(id -u)" != "0" ] && SUDO="sudo"
          . /etc/os-release
          # ruby-builder tarballs are built for the hostedtoolcache prefix (shared libruby)
          RB_DIR=/opt/hostedtoolcache/Ruby/3.3.6
          $SUDO rm -rf "$RB_DIR"; $SUDO mkdir -p "$RB_DIR"
          if curl -fsSL "https://github.com/ruby/ruby-builder/releases/download/toolcache/ruby-3.3.6-ubuntu-${VERSION_ID}.tar.gz" -o /tmp/rdp-ruby.tgz; then
            $SUDO tar -xzf /tmp/rdp-ruby.tgz -C "$RB_DIR"
            RUBY_BIN="$(find "$RB_DIR" -type f -path '*/bin/ruby' | head -n1)"
            if [ -n "$RUBY_BIN" ]; then
              RB_BIN_DIR="$(dirname "$RUBY_BIN")"
              RB_LIB_DIR="$(dirname "$RB_BIN_DIR")/lib"
              NEW_LD="$RB_LIB_DIR${LD_LIBRARY_PATH:+:$LD_LIBRARY_PATH}"
              if LD_LIBRARY_PATH="$NEW_LD" "$RUBY_BIN" -e 'exit(Gem::Version.new(RUBY_VERSION) >= Gem::Version.new("3.1") ? 0 : 1)'; then
                echo "$RB_BIN_DIR" >> "$GITHUB_PATH"
                echo "LD_LIBRARY_PATH=$NEW_LD" >> "$GITHUB_ENV"
                LD_LIBRARY_PATH="$NEW_LD" "$RUBY_BIN" --version
                exit 0
              fi
              echo "toolcache ruby not usable, falling back to apt"
            fi
          fi
          $SUDO apt-get update -y
          $SUDO apt-get install -y ruby
          ruby --version

      - name: Set up fake tap and fake brew
        run: |
          set -e
          ROOT=/tmp/rdp
          rm -rf "$ROOT"
          mkdir -p "$ROOT/bin" "$ROOT/brew-root" "$ROOT/tap/Formula"
          TAP_DIR="$ROOT/tap"
          OWNER="${GITHUB_REPOSITORY%%/*}"
          NAME="${GITHUB_REPOSITORY#*/}"
          TAP="$(echo "$OWNER" | tr '[:upper:]' '[:lower:]')/$(echo "$NAME" | tr '[:upper:]' '[:lower:]' | sed 's/^homebrew-//')"
          OLD_DATE="$(date -d '13 months ago' +%F)"
          RECENT_DATE="$(date -d '1 month ago' +%F)"
          echo "recent" > "$TAP_DIR/Formula/recent.rb"
          echo "foreign" > "$TAP_DIR/Formula/foreign.rb"
          echo "active" > "$TAP_DIR/Formula/active.rb"
          cat > "$ROOT/formulae.json" <<EOF
          {"formulae":[
            {"name":"recent","tap":"$TAP","disabled":true,"disable_date":"$RECENT_DATE","ruby_source_path":"Formula/recent.rb"},
            {"name":"foreign","tap":"someone/else","disabled":true,"disable_date":"$OLD_DATE","ruby_source_path":"Formula/foreign.rb"},
            {"name":"active","tap":"$TAP","disabled":false,"disable_date":"$OLD_DATE","ruby_source_path":"Formula/active.rb"}
          ]}
          EOF
          echo '{"casks":[]}' > "$ROOT/casks.json"
          git -C "$TAP_DIR" init --quiet
          git -C "$TAP_DIR" add --all
          git -C "$TAP_DIR" commit --quiet --message "Add fixtures"
          cat > "$ROOT/bin/brew" <<EOF
          #!/bin/sh
          echo "\$*" >> "$ROOT/brew.log"
          case "\$1" in
            --repository)
              if [ -n "\$2" ]; then echo "$TAP_DIR"; else echo "$ROOT/brew-root"; fi ;;
            --prefix) echo "$ROOT/brew-root" ;;
            info)
              case " \$* " in
                *" --formula "*) cat "$ROOT/formulae.json" ;;
                *" --cask "*) cat "$ROOT/casks.json" ;;
              esac ;;
          esac
          exit 0
          EOF
          chmod +x "$ROOT/bin/brew"
          echo "$ROOT/bin" >> "$GITHUB_PATH"

      # act cannot parse the action's nested `uses: $/setup-ruby` reference and
      # marks the composite step failed even though main.rb runs to completion.
      # The checks below on the output and the tap contents stay strict.
      - id: action
        uses: .
        continue-on-error: true

      - name: Check action outcome
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "success" ] && [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: unexpected outcome '$OUTCOME'"; exit 1
          fi
          echo "PASS"

      - name: Assert packages-removed is false
        env:
          ACTUAL: ${{ steps.action.outputs.packages-removed }}
        run: |
          echo "actual: $ACTUAL"
          if [ "$ACTUAL" != "false" ]; then
            echo "FAIL: expected 'false'"
            exit 1
          fi
          echo "PASS"

      - name: Assert all files kept and no commits added
        run: |
          TAP_DIR=/tmp/rdp/tap
          for f in recent foreign active; do
            if [ ! -f "$TAP_DIR/Formula/$f.rb" ]; then
              echo "FAIL: $f.rb should have been kept"; exit 1
            fi
          done
          COUNT="$(git -C "$TAP_DIR" rev-list --count HEAD)"
          echo "commit count: $COUNT"
          if [ "$COUNT" != "1" ]; then
            echo "FAIL: expected exactly 1 commit"; exit 1
          fi
          echo "PASS"
