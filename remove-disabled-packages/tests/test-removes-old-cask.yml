name: Test removes cask disabled over a year ago
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Provision Ruby >= 3.1 (act skips the action's setup-ruby step)
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: bash "$GITHUB_WORKSPACE/tests/fixtures/setup-modern-ruby.sh"
      - name: Set up fake brew and tap
        run: bash "$GITHUB_WORKSPACE/tests/fixtures/setup-fake-brew.sh" Casks
      - name: Populate tap fixtures
        run: |
          OLD="$(date -d '13 months ago' +%F)"
          echo "# old-cask" > "$TAP_DIR/Casks/old-cask.rb"
          cat > "$FAKE_ROOT/casks.json" <<EOF
          {"casks":[
            {"token":"old-cask","tap":"$TARGET_TAP","disabled":true,"disable_date":"$OLD","ruby_source_path":"Casks/old-cask.rb"}
          ]}
          EOF
          cat "$FAKE_ROOT/casks.json"
          git -C "$TAP_DIR" add --all
          git -C "$TAP_DIR" commit --quiet -m "Add fixtures"
      # act cannot resolve the action's internal `$/setup-ruby` reference and
      # marks the composite step failed even when main.rb succeeds, so the
      # outcome itself is not asserted strictly; the output and tap state are.
      - id: action
        uses: .
        continue-on-error: true
      - name: Assert step ran and packages-removed is true
        env:
          ACTUAL: ${{ steps.action.outputs.packages-removed }}
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          echo "actual: $ACTUAL"
          if [ "$OUTCOME" != "success" ] && [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: unexpected outcome '$OUTCOME'"; exit 1
          fi
          if [ "$ACTUAL" != "true" ]; then
            echo "FAIL: expected 'true'"
            exit 1
          fi
          echo "PASS"
      - name: Assert cask removed and committed
        run: |
          if [ -e "$TAP_DIR/Casks/old-cask.rb" ]; then
            echo "FAIL: old-cask.rb should have been removed"; exit 1
          fi
          SUBJECT="$(git -C "$TAP_DIR" log -1 --format=%s)"
          echo "latest commit: $SUBJECT"
          if [ "$SUBJECT" != "old-cask: remove cask" ]; then
            echo "FAIL: expected commit 'old-cask: remove cask'"; exit 1
          fi
          if [ -f "$FAKE_ROOT/brew.log" ] && grep -q -- '--formula' "$FAKE_ROOT/brew.log"; then
            echo "FAIL: formulae should not be queried without a Formula dir"; exit 1
          fi
          echo "PASS"
