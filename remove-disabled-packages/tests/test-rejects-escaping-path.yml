name: Test rejects ruby_source_path escaping the tap
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Set up fake brew, ruby and tap
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bash "$GITHUB_WORKSPACE/tests/fixtures/fake-brew.sh" init
      - name: Create tap fixtures
        run: |
          mkdir -p "$TAP_DIRECTORY/Formula"
          echo "# outside" > "$TAP_DIRECTORY/../outside.rb"
          cat > "$FORMULA_JSON" <<EOF
          {"formulae":[
            {"name":"unsafe","tap":"$TAP_NAME","disabled":true,"disable_date":"$OLD_DATE","ruby_source_path":"../outside.rb"}
          ]}
          EOF
          bash "$GITHUB_WORKSPACE/tests/fixtures/fake-brew.sh" commit
      - id: action
        uses: .
        continue-on-error: true
      - name: Assert action failed and outside file survived
        env:
          OUTCOME: ${{ steps.action.outcome }}
          ACTUAL: ${{ steps.action.outputs.packages-removed }}
        run: |
          echo "outcome: $OUTCOME"
          echo "packages-removed: $ACTUAL"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected the action to fail on an escaping path"; exit 1
          fi
          if [ ! -f "$TAP_DIRECTORY/../outside.rb" ]; then
            echo "FAIL: file outside the tap was deleted"; exit 1
          fi
          if [ -n "$ACTUAL" ]; then
            echo "FAIL: no output expected on failure"; exit 1
          fi
          echo "PASS"
