name: Test recently disabled formula is kept
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Set up fake brew and tap
        run: bash "$GITHUB_WORKSPACE/tests/fixtures/setup-fake-brew.sh"
      - name: Add a formula disabled one month ago
        run: |
          TAP="$(cat /tmp/fakebrew/tapname)"
          RECENT="$(date -d '1 month ago' +%F)"
          cat > /tmp/fakebrew/tap/Formula/newbar.rb <<EOF
          class Newbar < Formula
            url "https://example.com/newbar-1.0.tar.gz"
            disable! date: "$RECENT", because: :unmaintained
          end
          EOF
          git -C /tmp/fakebrew/tap add -A
          git -C /tmp/fakebrew/tap commit -q -m "add newbar"
          cat > /tmp/fakebrew/info/formula.json <<EOF
          {"formulae":[{"name":"newbar","tap":"$TAP","disabled":true,"disable_date":"$RECENT","ruby_source_path":"Formula/newbar.rb"}],"casks":[]}
          EOF
      # act cannot parse the action's internal "uses: $/setup-ruby" reference and
      # marks the composite step failed even though main.rb runs and sets outputs.
      # Accept success/failure outcome, but strictly verify outputs and side effects.
      - id: action
        uses: .
        continue-on-error: true
      - name: Assert action step ran
        env:
          OUTCOME: ${{ steps.action.outcome }}
          REMOVED: ${{ steps.action.outputs.packages-removed }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "success" ] && [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
          if [ "$REMOVED" != "true" ] && [ "$REMOVED" != "false" ]; then
            echo "FAIL: main.rb did not set packages-removed (got '$REMOVED')"
            exit 1
          fi
          echo "PASS"
      - name: Assert formula kept
        env:
          REMOVED: ${{ steps.action.outputs.packages-removed }}
          PARTIAL: ${{ steps.action.outputs.partially-disabled-packages }}
        run: |
          echo "packages-removed: $REMOVED"
          echo "partially-disabled-packages: $PARTIAL"
          if [ "$REMOVED" != "false" ]; then
            echo "FAIL: expected packages-removed=false"
            exit 1
          fi
          if [ -n "$PARTIAL" ]; then
            echo "FAIL: expected empty partially-disabled-packages"
            exit 1
          fi
          if [ ! -f /tmp/fakebrew/tap/Formula/newbar.rb ]; then
            echo "FAIL: newbar.rb was removed"
            exit 1
          fi
          echo "PASS"
