name: Test removal of formula disabled over a year ago
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Set up fake brew and tap
        run: bash "$GITHUB_WORKSPACE/tests/fixtures/setup-fake-brew.sh"
      - name: Add a formula disabled two years ago
        run: |
          TAP="$(cat /tmp/fakebrew/tapname)"
          OLD="$(date -d '2 years ago' +%F)"
          cat > /tmp/fakebrew/tap/Formula/oldfoo.rb <<EOF
          class Oldfoo < Formula
            url "https://example.com/oldfoo-1.0.tar.gz"
            disable! date: "$OLD", because: :unmaintained
          end
          EOF
          git -C /tmp/fakebrew/tap add -A
          git -C /tmp/fakebrew/tap commit -q -m "add oldfoo"
          cat > /tmp/fakebrew/info/formula.json <<EOF
          {"formulae":[{"name":"oldfoo","tap":"$TAP","disabled":true,"disable_date":"$OLD","ruby_source_path":"Formula/oldfoo.rb"}],"casks":[]}
          EOF
          cat /tmp/fakebrew/info/formula.json
      # act cannot parse the action's internal "uses: $/setup-ruby" reference and
      # marks the composite step failed even though main.rb runs and sets outputs.
      # Accept success/failure outcome, but strictly verify outputs and side effects.
      - id: action
        uses: .
        continue-on-error: true
      - name: Assert action step ran
        env:
          OUTCOME: ${{ steps.action.outcome }}
          REMOVED: ${{ steps.action.outputs.packages-removed }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "success" ] && [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
          if [ "$REMOVED" != "true" ] && [ "$REMOVED" != "false" ]; then
            echo "FAIL: main.rb did not set packages-removed (got '$REMOVED')"
            exit 1
          fi
          echo "PASS"
      - name: Assert formula removed and committed
        env:
          REMOVED: ${{ steps.action.outputs.packages-removed }}
          PARTIAL: ${{ steps.action.outputs.partially-disabled-packages }}
        run: |
          echo "packages-removed: $REMOVED"
          echo "partially-disabled-packages: $PARTIAL"
          if [ "$REMOVED" != "true" ]; then
            echo "FAIL: expected packages-removed=true"
            exit 1
          fi
          if [ -n "$PARTIAL" ]; then
            echo "FAIL: expected empty partially-disabled-packages"
            exit 1
          fi
          if [ -f /tmp/fakebrew/tap/Formula/oldfoo.rb ]; then
            echo "FAIL: oldfoo.rb still exists"
            exit 1
          fi
          MSG="$(git -C /tmp/fakebrew/tap log -1 --format=%s)"
          echo "last commit: $MSG"
          if [ "$MSG" != "oldfoo: remove formula" ]; then
            echo "FAIL: expected commit 'oldfoo: remove formula'"
            exit 1
          fi
          if [ -n "$(git -C /tmp/fakebrew/tap status --porcelain)" ]; then
            echo "FAIL: tap working tree not clean"
            exit 1
          fi
          echo "PASS"
