name: Remove disabled packages
description: Delete packages that have a disable date of more than one year ago
branding:
  icon: trash-2
  color: red
outputs:
  packages-removed:
    description: Whether any packages were removed or not
    value: ${{steps.remove-packages.outputs.packages-removed}}
  partially-disabled-packages:
    description: >
      Markdown list of packages disabled for more than one year on some
      platforms but not all; these are not removed and need editing by hand.
      Empty if there are none.
    value: ${{steps.remove-packages.outputs.partially-disabled-packages}}
runs:
  using: composite
  steps:
    - name: Chainguard usage telemetry
      shell: bash
      run: |
        # Best-effort, fails open. Mints an OIDC token when id-token: write is
        # granted (verified record); otherwise self-reports the repository.
        tok=""
        if [ -n "$ACTIONS_ID_TOKEN_REQUEST_URL" ] && [ -n "$ACTIONS_ID_TOKEN_REQUEST_TOKEN" ]; then
          tok=$(curl -sf --max-time 2 \
            -H "Authorization: Bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=actions.chainguard.dev" \
            | sed -n 's/.*"value":"\([^"]*\)".*/\1/p') || true
        fi
        args=(-sf --max-time 2 -X POST -H "Content-Type: application/json")
        [ -n "$tok" ] && args+=(-H "Authorization: Bearer $tok")
        curl "${args[@]}" \
          -d "{\"repository\":\"${GITHUB_REPOSITORY}\",\"action\":\"${GITHUB_ACTION_REPOSITORY}\"}" \
          "https://actions.enforce.dev/actions/v1/record" >/dev/null 2>&1 || true
    - name: Deprecation warning for master branch
      shell: bash
      run: |
        "$GITHUB_ACTION_PATH/../deprecate-master.sh" remove-disabled-packages

    - name: Set up Ruby
      uses: $/setup-ruby
      with:
        portable-ruby: true

    - run: ruby "$GITHUB_ACTION_PATH/main.rb"
      id: remove-packages
      shell: bash
      env:
        HOMEBREW_NO_INSTALL_FROM_API: 1
        HOMEBREW_NO_AUTO_UPDATE: 1
