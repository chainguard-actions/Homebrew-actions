name: Test nonexistent user fails
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        continue-on-error: true
        with:
          # Double hyphens are not allowed in GitHub usernames, so this can never exist
          username: no--such--user--zz-actionchain
      - name: Assert action failed and set no outputs
        env:
          OUTCOME: ${{ steps.action.outcome }}
          NAME: ${{ steps.action.outputs.name }}
          EMAIL: ${{ steps.action.outputs.email }}
        run: |
          echo "outcome: $OUTCOME"
          echo "name: $NAME"
          echo "email: $EMAIL"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected failure for nonexistent user"
            exit 1
          fi
          if [ -n "$NAME" ] || [ -n "$EMAIL" ]; then
            echo "FAIL: expected no outputs on failure"
            exit 1
          fi
          echo "PASS"
