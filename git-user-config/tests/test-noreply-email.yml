name: Test email fallback format
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          username: octocat
      - name: Assert email is public email or id+login noreply fallback
        env:
          ACTUAL: ${{ steps.action.outputs.email }}
          GH_TOKEN: ${{ github.token }}
        run: |
          echo "actual: $ACTUAL"
          # octocat's id is 583231
          if [ "$ACTUAL" = "583231+octocat@users.noreply.github.com" ]; then
            echo "PASS: noreply fallback"
            exit 0
          fi
          case "$ACTUAL" in
            *@users.noreply.github.com)
              echo "FAIL: unexpected noreply format '$ACTUAL'"
              exit 1
              ;;
            *@*)
              echo "PASS: public email used"
              ;;
            *)
              echo "FAIL: invalid email '$ACTUAL'"
              exit 1
              ;;
          esac
