name: Test basic usage (octocat)
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          username: octocat
      - name: Assert name output
        env:
          ACTUAL: ${{ steps.action.outputs.name }}
        run: |
          echo "actual: $ACTUAL"
          if [ "$ACTUAL" != "The Octocat" ]; then
            echo "FAIL: expected 'The Octocat'"
            exit 1
          fi
          echo "PASS"
      - name: Assert email output
        env:
          ACTUAL: ${{ steps.action.outputs.email }}
        run: |
          echo "actual: $ACTUAL"
          if [ -z "$ACTUAL" ]; then
            echo "FAIL: email output is empty"
            exit 1
          fi
          case "$ACTUAL" in
            *@*) ;;
            *) echo "FAIL: email does not look like an email"; exit 1 ;;
          esac
          echo "PASS"
      - name: Assert global git config matches outputs
        env:
          NAME: ${{ steps.action.outputs.name }}
          EMAIL: ${{ steps.action.outputs.email }}
        run: |
          GIT_NAME="$(git config --global user.name)"
          GIT_EMAIL="$(git config --global user.email)"
          echo "git user.name: $GIT_NAME"
          echo "git user.email: $GIT_EMAIL"
          if [ "$GIT_NAME" != "$NAME" ]; then
            echo "FAIL: git user.name '$GIT_NAME' != output '$NAME'"
            exit 1
          fi
          if [ "$GIT_EMAIL" != "$EMAIL" ]; then
            echo "FAIL: git user.email '$GIT_EMAIL' != output '$EMAIL'"
            exit 1
          fi
          echo "PASS"
