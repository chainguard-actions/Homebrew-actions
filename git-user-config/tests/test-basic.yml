name: Test basic usage with explicit user
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          username: octocat
      - name: Assert outputs
        env:
          NAME: ${{ steps.action.outputs.name }}
          EMAIL: ${{ steps.action.outputs.email }}
        run: |
          echo "name: $NAME"
          echo "email: $EMAIL"
          if [ "$NAME" != "The Octocat" ]; then
            echo "FAIL: expected name 'The Octocat'"
            exit 1
          fi
          if [ -z "$EMAIL" ]; then
            echo "FAIL: email is empty"
            exit 1
          fi
          case "$EMAIL" in
            *@*) ;;
            *) echo "FAIL: email does not look like an email"; exit 1 ;;
          esac
          echo "PASS"
      - name: Assert git global config matches outputs
        env:
          NAME: ${{ steps.action.outputs.name }}
          EMAIL: ${{ steps.action.outputs.email }}
        run: |
          GN="$(git config --global user.name)"
          GE="$(git config --global user.email)"
          echo "git user.name: $GN"
          echo "git user.email: $GE"
          if [ "$GN" != "$NAME" ]; then echo "FAIL: user.name mismatch"; exit 1; fi
          if [ "$GE" != "$EMAIL" ]; then echo "FAIL: user.email mismatch"; exit 1; fi
          echo "PASS"
