name: Test stable=false (track main branch)
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          stable: "false"
      - name: Assert gems-hash output
        env:
          GEMS_HASH: ${{ steps.action.outputs.gems-hash }}
        run: |
          echo "gems-hash: $GEMS_HASH"
          if ! echo "$GEMS_HASH" | grep -qE '^[0-9a-f]{64}$'; then
            echo "FAIL: gems-hash is not a sha256"
            exit 1
          fi
          echo "PASS"
      - name: Assert brew repo on main and no update-to-tag
        run: |
          BREW="$(command -v brew || true)"
          for c in /home/linuxbrew/.linuxbrew/bin/brew /opt/homebrew/bin/brew /usr/local/bin/brew; do
            [ -z "$BREW" ] && [ -x "$c" ] && BREW="$c"
          done
          echo "brew: $BREW"
          if [ -z "$BREW" ]; then echo "FAIL: brew not found"; exit 1; fi
          REPO="$("$BREW" --repo)"
          BRANCH="$(git -C "$REPO" symbolic-ref --short HEAD || true)"
          echo "brew repo branch: $BRANCH"
          if [ "$BRANCH" != "main" ]; then
            echo "FAIL: expected brew repo on 'main' branch"
            exit 1
          fi
          echo "HOMEBREW_UPDATE_TO_TAG=${HOMEBREW_UPDATE_TO_TAG:-}"
          if [ "${HOMEBREW_UPDATE_TO_TAG:-}" = "1" ]; then
            echo "FAIL: HOMEBREW_UPDATE_TO_TAG should not be set when stable=false"
            exit 1
          fi
          echo "PASS"
