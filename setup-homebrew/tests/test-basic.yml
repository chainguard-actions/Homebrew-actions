name: Test basic usage (defaults)
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
      - name: Assert gems outputs
        env:
          GEMS_PATH: ${{ steps.action.outputs.gems-path }}
          GEMS_HASH: ${{ steps.action.outputs.gems-hash }}
        run: |
          echo "gems-path: $GEMS_PATH"
          echo "gems-hash: $GEMS_HASH"
          case "$GEMS_PATH" in
            */Library/Homebrew/vendor/bundle/ruby/) ;;
            *) echo "FAIL: unexpected gems-path"; exit 1 ;;
          esac
          if ! echo "$GEMS_HASH" | grep -qE '^[0-9a-f]{64}$'; then
            echo "FAIL: gems-hash is not a sha256"
            exit 1
          fi
          echo "PASS"
      - name: Assert no tap outputs for non-tap repository
        env:
          REPO_PATH: ${{ steps.action.outputs.repository-path }}
          TAP_NAME: ${{ steps.action.outputs.tap-name }}
        run: |
          echo "repository-path: '$REPO_PATH'"
          echo "tap-name: '$TAP_NAME'"
          if [ -n "$TAP_NAME" ] || [ -n "$REPO_PATH" ]; then
            echo "FAIL: expected empty tap-name and repository-path"
            exit 1
          fi
          echo "PASS"
      - name: Assert brew installed and on stable tag
        run: |
          BREW="$(command -v brew || true)"
          for c in /home/linuxbrew/.linuxbrew/bin/brew /opt/homebrew/bin/brew /usr/local/bin/brew; do
            [ -z "$BREW" ] && [ -x "$c" ] && BREW="$c"
          done
          echo "brew: $BREW"
          if [ -z "$BREW" ]; then echo "FAIL: brew not found"; exit 1; fi
          "$BREW" --version
          REPO="$("$BREW" --repo)"
          BRANCH="$(git -C "$REPO" symbolic-ref --short HEAD || true)"
          echo "brew repo branch: $BRANCH"
          if [ "$BRANCH" != "stable" ]; then
            echo "FAIL: expected brew repo on 'stable' branch"
            exit 1
          fi
          echo "PASS"
      - name: Assert environment exported
        env:
          EXPECTED_TOKEN: ${{ github.token }}
        run: |
          echo "HOMEBREW_UPDATE_TO_TAG=${HOMEBREW_UPDATE_TO_TAG:-}"
          if [ "${HOMEBREW_UPDATE_TO_TAG:-}" != "1" ]; then
            echo "FAIL: expected HOMEBREW_UPDATE_TO_TAG=1"
            exit 1
          fi
          if [ -n "${HOMEBREW_NO_INSTALL_FROM_API:-}" ]; then
            echo "FAIL: HOMEBREW_NO_INSTALL_FROM_API should be empty"
            exit 1
          fi
          if [ -z "${HOMEBREW_GITHUB_API_TOKEN:-}" ]; then
            echo "FAIL: HOMEBREW_GITHUB_API_TOKEN not set"
            exit 1
          fi
          if [ "${HOMEBREW_DEBUG:-}" = "1" ]; then
            echo "FAIL: HOMEBREW_DEBUG should not be set by default"
            exit 1
          fi
          echo "PASS"
