name: Test basic usage
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
      - name: Assert brew installed
        run: |
          BREW=""
          for b in /home/linuxbrew/.linuxbrew/bin/brew "$(command -v brew || true)"; do
            if [ -n "$b" ] && [ -x "$b" ]; then BREW="$b"; break; fi
          done
          echo "brew: $BREW"
          if [ -z "$BREW" ]; then
            echo "FAIL: brew executable not found"
            exit 1
          fi
          "$BREW" --version
          echo "PASS"
      - name: Assert gems-path output
        env:
          ACTUAL: ${{ steps.action.outputs.gems-path }}
        run: |
          echo "actual: $ACTUAL"
          case "$ACTUAL" in
            */Library/Homebrew/vendor/bundle/ruby/) echo "PASS" ;;
            *) echo "FAIL: unexpected gems-path"; exit 1 ;;
          esac
      - name: Assert gems-hash output
        env:
          ACTUAL: ${{ steps.action.outputs.gems-hash }}
        run: |
          echo "actual: $ACTUAL"
          if ! echo "$ACTUAL" | grep -qE '^[0-9a-f]{64}$'; then
            echo "FAIL: gems-hash is not a sha256 hex digest"
            exit 1
          fi
          echo "PASS"
      - name: Assert tap outputs empty for non-tap repository
        env:
          TAP: ${{ steps.action.outputs.tap-name }}
          REPO_PATH: ${{ steps.action.outputs.repository-path }}
        run: |
          echo "tap-name: '$TAP' repository-path: '$REPO_PATH'"
          if [ -n "$TAP" ] || [ -n "$REPO_PATH" ]; then
            echo "FAIL: expected empty tap-name/repository-path"
            exit 1
          fi
          echo "PASS"
      - name: Assert env exported
        run: |
          echo "HOMEBREW_UPDATE_TO_TAG='${HOMEBREW_UPDATE_TO_TAG:-}'"
          if [ "${HOMEBREW_UPDATE_TO_TAG:-}" != "1" ]; then
            echo "FAIL: expected HOMEBREW_UPDATE_TO_TAG=1 (stable auto -> true)"
            exit 1
          fi
          if [ -z "${HOMEBREW_GITHUB_API_TOKEN:-}" ]; then
            echo "FAIL: expected HOMEBREW_GITHUB_API_TOKEN to be exported"
            exit 1
          fi
          if [ -n "${HOMEBREW_DEBUG:-}" ]; then
            echo "FAIL: HOMEBREW_DEBUG should not be set without debug"
            exit 1
          fi
          echo "PASS"
      - name: Assert brew repo on stable branch
        run: |
          REPO="$(/home/linuxbrew/.linuxbrew/bin/brew --repo)"
          BRANCH="$(git -C "$REPO" symbolic-ref --short HEAD)"
          echo "branch: $BRANCH"
          if [ "$BRANCH" != "stable" ]; then
            echo "FAIL: expected brew repo on 'stable' branch"
            exit 1
          fi
          echo "PASS"
