name: Test close existing issue
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        continue-on-error: true
        with:
          title: "act harness nonexistent issue title 7f3a9c"
          body: "unused"
          close-existing: "true"
          close-from-author: "github-actions[bot]"
          close-comment: "Closing from act harness test."
      - name: Assert action ran or failed gracefully on sentinel repo
        env:
          RESULT: ${{ steps.action.outputs.outcome }}
          NUMBER: ${{ steps.action.outputs.number }}
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          echo "result: $RESULT number: $NUMBER"
          if [ "$OUTCOME" = "success" ]; then
            if [ "$RESULT" = "none" ]; then
              if [ -n "$NUMBER" ]; then
                echo "FAIL: number should be empty when outcome is none"
                exit 1
              fi
              echo "PASS: no existing issue, nothing closed"
            elif [ "$RESULT" = "closed" ]; then
              if ! echo "$NUMBER" | grep -qE '^[0-9]+$'; then
                echo "FAIL: number is not numeric"
                exit 1
              fi
              echo "PASS: closed #$NUMBER"
            else
              echo "FAIL: close-existing must yield 'none' or 'closed', got '$RESULT'"
              exit 1
            fi
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (sentinel repo is not resolvable)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
