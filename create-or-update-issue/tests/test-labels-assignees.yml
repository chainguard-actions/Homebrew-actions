name: Test labels, assignees and type
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        continue-on-error: true
        with:
          title: "actionchain harness labeled issue"
          body: "Body with labels"
          labels: "bug,help wanted"
          assignees: "octocat"
          type: "Bug"
      - name: Assert action ran (created, or failed gracefully)
        env:
          RESULT: ${{ steps.action.outputs.outcome }}
          NUMBER: ${{ steps.action.outputs.number }}
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          echo "result: $RESULT number: $NUMBER"
          if [ "$OUTCOME" = "success" ]; then
            if [ "$RESULT" != "created" ] || [ -z "$NUMBER" ]; then
              echo "FAIL: expected created issue with number"
              exit 1
            fi
            echo "PASS"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (sentinel repo is not resolvable)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
