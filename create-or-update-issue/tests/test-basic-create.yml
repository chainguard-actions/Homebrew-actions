name: Test basic issue creation
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        continue-on-error: true
        with:
          title: "actionchain harness test issue"
          body: "This is a test body"
      - name: Assert action ran (created, or failed gracefully on the sentinel repo)
        env:
          RESULT: ${{ steps.action.outputs.outcome }}
          NUMBER: ${{ steps.action.outputs.number }}
          NODE_ID: ${{ steps.action.outputs.node_id }}
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          echo "result: $RESULT number: $NUMBER node_id: $NODE_ID"
          if [ "$OUTCOME" = "success" ]; then
            if [ "$RESULT" != "created" ]; then
              echo "FAIL: expected outcome 'created'"
              exit 1
            fi
            if [ -z "$NUMBER" ] || [ -z "$NODE_ID" ]; then
              echo "FAIL: number/node_id empty"
              exit 1
            fi
            echo "PASS: created issue $NUMBER"
          elif [ "$OUTCOME" = "failure" ]; then
            if [ -n "$RESULT" ]; then
              echo "FAIL: outcome output set despite failure"
              exit 1
            fi
            echo "PASS: action failed gracefully (sentinel repo is not resolvable)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
