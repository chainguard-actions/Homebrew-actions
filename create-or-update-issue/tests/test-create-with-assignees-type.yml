name: Test create issue with assignees and type
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        continue-on-error: true
        with:
          title: "actionchain harness test issue with assignees"
          body: "This is a test body"
          assignees: "octocat,hubot"
          type: "Bug"
      - name: Assert action created an issue or failed gracefully on the sentinel repo
        env:
          RESULT: ${{ steps.action.outputs.outcome }}
          ISSUE: ${{ steps.action.outputs.issue_number }}
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          echo "result: $RESULT"
          echo "issue: $ISSUE"
          if [ "$OUTCOME" = "success" ]; then
            if [ "$RESULT" != "created" ] || [ -z "$ISSUE" ]; then
              echo "FAIL: expected outcome 'created' with an issue number"
              exit 1
            fi
            echo "PASS: got '$RESULT' #$ISSUE"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (sentinel repo is not resolvable)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
