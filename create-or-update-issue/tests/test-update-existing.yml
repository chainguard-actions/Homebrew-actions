name: Test update existing issue
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        continue-on-error: true
        with:
          title: "act harness update-existing issue"
          body: "Updated body content."
          update-existing: "true"
          skip-if-unchanged: "true"
      - name: Assert action ran or failed gracefully on sentinel repo
        env:
          RESULT: ${{ steps.action.outputs.outcome }}
          NUMBER: ${{ steps.action.outputs.number }}
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          echo "result: $RESULT number: $NUMBER"
          if [ "$OUTCOME" = "success" ]; then
            case "$RESULT" in
              created|commented|unchanged) ;;
              *) echo "FAIL: unexpected outcome output '$RESULT'"; exit 1 ;;
            esac
            if ! echo "$NUMBER" | grep -qE '^[0-9]+$'; then
              echo "FAIL: number is not numeric"
              exit 1
            fi
            echo "PASS: $RESULT #$NUMBER"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (sentinel repo is not resolvable)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
