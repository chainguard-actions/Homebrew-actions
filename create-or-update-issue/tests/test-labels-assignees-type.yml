name: Test create issue with labels, assignees and type
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        continue-on-error: true
        with:
          title: "act harness labelled test issue"
          body: "This is a test issue body with labels."
          labels: "bug, help wanted"
          assignees: "octocat"
          type: "Bug"
      - name: Assert action created issue or failed gracefully on sentinel repo
        env:
          RESULT: ${{ steps.action.outputs.outcome }}
          NUMBER: ${{ steps.action.outputs.number }}
          NODE_ID: ${{ steps.action.outputs.node_id }}
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          echo "result: $RESULT number: $NUMBER node_id: $NODE_ID"
          if [ "$OUTCOME" = "success" ]; then
            if [ "$RESULT" != "created" ]; then
              echo "FAIL: expected outcome 'created'"
              exit 1
            fi
            if ! echo "$NUMBER" | grep -qE '^[0-9]+$'; then
              echo "FAIL: number is not numeric"
              exit 1
            fi
            if [ -z "$NODE_ID" ]; then
              echo "FAIL: node_id empty"
              exit 1
            fi
            echo "PASS: created issue #$NUMBER"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (sentinel repo is not resolvable)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
