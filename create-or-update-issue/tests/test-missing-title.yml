name: Test missing required title fails
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        continue-on-error: true
        with:
          body: "Body without a title"
      - name: Assert action failed
        env:
          RESULT: ${{ steps.action.outputs.outcome }}
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          echo "result: $RESULT"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected failure when title is missing"
            exit 1
          fi
          if [ -n "$RESULT" ]; then
            echo "FAIL: no outcome output expected"
            exit 1
          fi
          echo "PASS"
