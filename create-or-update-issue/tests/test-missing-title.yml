name: Test missing required title
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        continue-on-error: true
        with:
          body: "Body without a title."
      - name: Assert action failed and set no outputs
        env:
          RESULT: ${{ steps.action.outputs.outcome }}
          NUMBER: ${{ steps.action.outputs.number }}
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          echo "result: $RESULT number: $NUMBER"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected failure when title is missing"
            exit 1
          fi
          if [ -n "$RESULT" ] || [ -n "$NUMBER" ]; then
            echo "FAIL: no outputs should be set on failure"
            exit 1
          fi
          echo "PASS"
