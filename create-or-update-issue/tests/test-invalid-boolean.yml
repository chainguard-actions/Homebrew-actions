name: Test invalid boolean input fails
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        continue-on-error: true
        with:
          repository: actionchain-harness/this-repo-does-not-exist-9c1e
          title: "Test issue"
          body: "Test body"
          update-existing: "maybe"
      - name: Assert action failed
        env:
          RESULT: ${{ steps.action.outputs.outcome }}
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          echo "result: $RESULT"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected failure for invalid boolean input"
            exit 1
          fi
          if [ -n "$RESULT" ]; then
            echo "FAIL: expected no outcome output"
            exit 1
          fi
          echo "PASS"
