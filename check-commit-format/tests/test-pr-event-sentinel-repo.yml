name: Test with pull request payload on sentinel repo
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Create pull_request event payload
        run: |
          echo '{"pull_request":{"number":1}}' > "$RUNNER_TEMP/pr-event.json"
          echo "PR_EVENT=$RUNNER_TEMP/pr-event.json" >> "$GITHUB_ENV"
      - id: action
        uses: .
        continue-on-error: true
        env:
          GITHUB_EVENT_PATH: ${{ env.PR_EVENT }}
        with:
          failure_label: custom-skip
          autosquash_label: custom-autosquash
          ignore_label: custom-ignore
      - name: Assert action failed gracefully
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (sentinel repo pulls API not resolvable)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
