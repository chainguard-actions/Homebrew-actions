name: Test invalid check_package_commit_format value
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        continue-on-error: true
        with:
          check_package_commit_format: not-a-boolean
      - name: Assert action failed on invalid boolean input
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "failure" ]; then
            echo "PASS: invalid boolean input rejected"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
