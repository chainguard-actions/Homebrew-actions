name: Test with package commit format check disabled
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        continue-on-error: true
        with:
          check_package_commit_format: "false"
      - name: Assert action failed gracefully
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          # No pull_request payload under workflow_dispatch and the repo is a
          # sentinel, so listing PR commits cannot succeed.
          if [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully without a pull request context"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
