name: Test invalid boolean input fails
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      # core.getBooleanInput throws on non-YAML-1.2 boolean values, so the
      # action must fail deterministically before doing any API calls.
      - id: action
        uses: .
        continue-on-error: true
        with:
          check_package_commit_format: "maybe"
      - name: Assert action failed
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected failure for invalid boolean input, got '$OUTCOME'"
            exit 1
          fi
          echo "PASS"
