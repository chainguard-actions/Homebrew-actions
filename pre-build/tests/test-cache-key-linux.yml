name: Test RubyGems cache key on Linux
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Run the shipped "Set up RubyGems cache" script
        run: |
          set -euo pipefail
          action_file="$(bash "$GITHUB_WORKSPACE/tests/fixtures/find-action.sh")"
          echo "action file: $action_file"
          python3 "$GITHUB_WORKSPACE/tests/fixtures/extract-step.py" "$action_file" "Set up RubyGems cache" > /tmp/step.sh
          cat /tmp/step.sh
          out="$(mktemp)"
          RUNNER_OS=Linux GITHUB_OUTPUT="$out" /bin/bash -euo pipefail /tmp/step.sh
          echo "--- output ---"; cat "$out"
          grep -qx 'cache_key_prefix=Linux' "$out" || { echo "FAIL: cache_key_prefix"; exit 1; }
          grep -qx 'macos_version=' "$out" || { echo "FAIL: macos_version should be empty"; exit 1; }
          grep -qx 'arch=' "$out" || { echo "FAIL: arch should be empty"; exit 1; }
          echo "PASS"
      - id: action
        uses: .
        continue-on-error: true
        with:
          bottles-directory: ${{ github.workspace }}/bottles-cache-linux
          cleanup: "false"
          download-bottles: "false"
      - name: Assert action outcome
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "success" ]; then
            [ -d "$GITHUB_WORKSPACE/bottles-cache-linux" ] || { echo "FAIL: bottles directory not created"; exit 1; }
            echo "PASS: action succeeded"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (Homebrew environment unavailable under act)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
