name: Test basic pre-build (no cleanup, no download)
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Pre-create stale bottles directory content
        run: |
          mkdir -p "$RUNNER_TEMP/bottles"
          echo stale > "$RUNNER_TEMP/bottles/stale.txt"
      - id: action
        uses: .
        continue-on-error: true
        with:
          bottles-directory: ${{ runner.temp }}/bottles
          cleanup: false
          download-bottles: false
      - name: Assert outcome
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "success" ]; then
            if [ ! -d "$RUNNER_TEMP/bottles" ]; then
              echo "FAIL: bottles directory not created"
              exit 1
            fi
            if [ -e "$RUNNER_TEMP/bottles/stale.txt" ]; then
              echo "FAIL: bottles directory was not recreated"
              exit 1
            fi
            echo "PASS: bottles directory recreated empty"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (Homebrew setup / sibling actions unavailable under harness)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
