name: Test basic pre-build
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        continue-on-error: true
        with:
          bottles-directory: ${{ github.workspace }}/bottles-test
      - name: Assert bottles directory created (or graceful failure)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "success" ]; then
            if [ ! -d "$GITHUB_WORKSPACE/bottles-test" ]; then
              echo "FAIL: bottles directory was not created"
              exit 1
            fi
            if [ -n "$(ls -A "$GITHUB_WORKSPACE/bottles-test")" ]; then
              echo "FAIL: bottles directory should be empty without download"
              exit 1
            fi
            echo "PASS: bottles directory created and empty"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (Homebrew/sibling actions unavailable under harness)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
