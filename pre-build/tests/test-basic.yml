name: Test basic pre-build (no cleanup, no download)
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Install stub brew on PATH
        run: |
          # The action's nested "setup-homebrew" step cannot be resolved under act,
          # so provide a stub brew that records its invocations.
          bin="$RUNNER_TEMP/fakebrew/bin"
          mkdir -p "$bin"
          cat > "$bin/brew" <<'EOF'
          #!/bin/bash
          echo "$*" >> "${RUNNER_TEMP}/fakebrew/calls.log"
          echo "stub brew: $*"
          exit 0
          EOF
          chmod +x "$bin/brew"
          : > "$RUNNER_TEMP/fakebrew/calls.log"
          echo "$bin" >> "$GITHUB_PATH"
      # act cannot resolve the nested "uses: $/setup-homebrew" step and marks the
      # composite as failed at the end even though all runnable steps succeed.
      # Tolerate that, but strictly verify the action's side effects below.
      - id: action
        uses: .
        continue-on-error: true
        with:
          bottles-directory: ${{ github.workspace }}/bottles-basic
          cleanup: "false"
          download-bottles: "false"
      - name: Assert action ran (not skipped)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "success" ] && [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
          echo "PASS"
      - name: Assert bottles directory exists and is empty
        run: |
          dir="$GITHUB_WORKSPACE/bottles-basic"
          ls -la "$dir" || true
          if [ ! -d "$dir" ]; then
            echo "FAIL: bottles directory $dir was not created"
            exit 1
          fi
          if [ -n "$(ls -A "$dir")" ]; then
            echo "FAIL: bottles directory is not empty"
            exit 1
          fi
          echo "PASS"
      - name: Assert brew test-bot setup ran and cleanup was skipped
        run: |
          log="$RUNNER_TEMP/fakebrew/calls.log"
          echo "brew calls:"; cat "$log"
          if ! grep -q -- "test-bot --only-setup" "$log"; then
            echo "FAIL: brew test-bot --only-setup was not invoked"
            exit 1
          fi
          if grep -q -- "--only-cleanup-before" "$log"; then
            echo "FAIL: cleanup ran although cleanup=false"
            exit 1
          fi
          echo "PASS"
