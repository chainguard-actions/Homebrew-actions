name: Test bottles directory setup on Linux
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Run the shipped "Set up bottles directory" script
        run: |
          set -euo pipefail
          action_file="$(bash "$GITHUB_WORKSPACE/tests/fixtures/find-action.sh")"
          echo "action file: $action_file"
          python3 "$GITHUB_WORKSPACE/tests/fixtures/extract-step.py" "$action_file" "Set up bottles directory" > /tmp/step.sh
          cat /tmp/step.sh
          work="$(mktemp -d)"
          cd "$work"
          mkdir -p bottles
          echo stale > bottles/old.tar.gz
          out="$(mktemp)"
          RUNNER_OS=Linux BOTTLES_DIR=bottles MACOS_VERSION= ARCH= GITHUB_OUTPUT="$out" \
            /bin/bash -euo pipefail /tmp/step.sh
          echo "--- output ---"; cat "$out"
          grep -qx 'bottle_specifier={ubuntu,linux}' "$out" || { echo "FAIL: bottle_specifier"; exit 1; }
          [ -d bottles ] || { echo "FAIL: bottles dir missing"; exit 1; }
          if [ -n "$(ls -A bottles)" ]; then echo "FAIL: bottles dir not emptied"; exit 1; fi
          echo "PASS"
      # Full action run: needs Homebrew + monorepo siblings that may be missing
      # under act, so accept a graceful failure but verify strictly on success.
      - id: action
        uses: .
        continue-on-error: true
        with:
          bottles-directory: ${{ github.workspace }}/bottles-linux
          cleanup: "false"
          download-bottles: "false"
      - name: Assert action outcome
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "success" ]; then
            [ -d "$GITHUB_WORKSPACE/bottles-linux" ] || { echo "FAIL: bottles directory not created"; exit 1; }
            echo "PASS: bottles directory created"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (Homebrew environment unavailable under act)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
