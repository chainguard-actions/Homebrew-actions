name: Test pre-build wipes existing bottles directory
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Install stub brew on PATH
        run: |
          bin="$RUNNER_TEMP/fakebrew/bin"
          mkdir -p "$bin"
          cat > "$bin/brew" <<'EOF'
          #!/bin/bash
          echo "$*" >> "${RUNNER_TEMP}/fakebrew/calls.log"
          echo "stub brew: $*"
          exit 0
          EOF
          chmod +x "$bin/brew"
          : > "$RUNNER_TEMP/fakebrew/calls.log"
          echo "$bin" >> "$GITHUB_PATH"
      - name: Pre-populate bottles directory
        run: |
          mkdir -p "$GITHUB_WORKSPACE/bottles-existing/sub"
          echo stale > "$GITHUB_WORKSPACE/bottles-existing/stale.tar.gz"
          echo stale > "$GITHUB_WORKSPACE/bottles-existing/sub/nested.json"
      # act cannot resolve the nested "uses: $/setup-homebrew" step and marks the
      # composite as failed at the end even though all runnable steps succeed.
      # Tolerate that, but strictly verify the action's side effects below.
      - id: action
        uses: .
        continue-on-error: true
        with:
          bottles-directory: ${{ github.workspace }}/bottles-existing
          cleanup: "false"
      - name: Assert action ran (not skipped)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "success" ] && [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
          echo "PASS"
      - name: Assert stale contents were removed
        run: |
          dir="$GITHUB_WORKSPACE/bottles-existing"
          ls -laR "$dir" || true
          if [ ! -d "$dir" ]; then
            echo "FAIL: bottles directory was not recreated"
            exit 1
          fi
          if [ -n "$(ls -A "$dir")" ]; then
            echo "FAIL: stale contents still present"
            exit 1
          fi
          echo "PASS"
      - name: Assert brew test-bot setup ran
        run: |
          log="$RUNNER_TEMP/fakebrew/calls.log"
          echo "brew calls:"; cat "$log"
          if ! grep -q -- "test-bot --only-setup" "$log"; then
            echo "FAIL: brew test-bot --only-setup was not invoked"
            exit 1
          fi
          echo "PASS"
