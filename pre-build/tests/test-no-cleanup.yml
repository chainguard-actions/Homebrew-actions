name: Test with cleanup disabled
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        continue-on-error: true
        with:
          bottles-directory: ${{ runner.temp }}/bottles-nocleanup
          cleanup: "false"
          download-bottles: "false"
      - name: Assert outcome
        env:
          OUTCOME: ${{ steps.action.outcome }}
          BOTTLES: ${{ runner.temp }}/bottles-nocleanup
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "success" ]; then
            if [ ! -d "$BOTTLES" ]; then
              echo "FAIL: bottles directory not created"
              exit 1
            fi
            if [ -n "$(ls -A "$BOTTLES")" ]; then
              echo "FAIL: bottles directory should be empty without download"
              exit 1
            fi
            echo "PASS"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed (Homebrew monorepo siblings/brew unavailable under act)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
