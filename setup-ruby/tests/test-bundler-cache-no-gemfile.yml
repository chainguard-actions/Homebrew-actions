name: Test bundler-cache without a Gemfile fails
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Create empty working directory without Gemfile
        shell: bash
        run: mkdir -p "$GITHUB_WORKSPACE/empty-gemfile-dir"
      - id: action
        uses: .
        continue-on-error: true
        with:
          bundler-cache: "true"
          working-directory: empty-gemfile-dir
      - name: Assert action failed
        shell: bash
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          # Either Homebrew is missing (setup fails) or the Gemfile is missing
          # (bundler cache config fails). Both must result in failure.
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected failure, got '$OUTCOME'"
            exit 1
          fi
          echo "PASS: action failed as expected"
