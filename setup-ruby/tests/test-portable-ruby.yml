name: Test portable Ruby
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Detect Homebrew availability
        id: brew
        shell: bash
        run: |
          if command -v brew >/dev/null 2>&1; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
          fi
      - id: action
        uses: .
        continue-on-error: true
        with:
          portable-ruby: "true"
      - name: Assert outcome matches Homebrew availability
        shell: bash
        env:
          BREW: ${{ steps.brew.outputs.available }}
          OUTCOME: ${{ steps.action.outcome }}
          RUBY_PATH: ${{ steps.action.outputs.ruby-path }}
          RUBY_VERSION_OUT: ${{ steps.action.outputs.ruby-version }}
        run: |
          echo "brew available: $BREW"
          echo "outcome: $OUTCOME"
          echo "ruby-path: $RUBY_PATH"
          echo "ruby-version: $RUBY_VERSION_OUT"
          if [ "$BREW" = "true" ]; then
            if [ "$OUTCOME" != "success" ]; then
              echo "FAIL: brew is available but action did not succeed"
              exit 1
            fi
            case "$RUBY_PATH" in
              *portable-ruby/current/bin/ruby) ;;
              *) echo "FAIL: ruby-path should point at portable Ruby"; exit 1 ;;
            esac
            if [ -z "$RUBY_VERSION_OUT" ]; then
              echo "FAIL: ruby-version empty"
              exit 1
            fi
            echo "PASS: portable Ruby set up"
          else
            if [ "$OUTCOME" != "failure" ]; then
              echo "FAIL: expected failure when Homebrew is missing, got '$OUTCOME'"
              exit 1
            fi
            echo "PASS: action failed as expected without Homebrew"
          fi
