name: Test portable Ruby
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Set up fake Homebrew
        run: bash "$GITHUB_WORKSPACE/tests/fixtures/setup-fake-brew.sh" missing
      # act cannot parse the skipped setup-homebrew `uses:` step and fails the composite
      # after all real steps ran; validate behaviour via outputs and calls.log instead.
      - id: action
        uses: .
        continue-on-error: true
        with:
          portable-ruby: "true"
      - name: Assert portable Ruby outputs
        env:
          OUTCOME: ${{ steps.action.outcome }}
          RUBY_PATH: ${{ steps.action.outputs.ruby-path }}
          RUBY_PREFIX: ${{ steps.action.outputs.ruby-prefix }}
          RUBY_VERSION_OUT: ${{ steps.action.outputs.ruby-version }}
        run: |
          echo "outcome: $OUTCOME"
          echo "ruby-path: $RUBY_PATH"
          echo "ruby-prefix: $RUBY_PREFIX"
          echo "ruby-version: $RUBY_VERSION_OUT"
          cat /tmp/fakebrew/calls.log
          case "$OUTCOME" in success|failure) ;; *) echo "FAIL: unexpected outcome"; exit 1 ;; esac
          P=/tmp/fakebrew/repo/Library/Homebrew/vendor/portable-ruby/current
          grep -q '^brew vendor-install ruby$' /tmp/fakebrew/calls.log || { echo "FAIL: vendor-install not called"; exit 1; }
          if grep -q '^brew install ruby' /tmp/fakebrew/calls.log; then
            echo "FAIL: formula install should not run for portable ruby"; exit 1
          fi
          [ "$RUBY_PATH" = "$P/bin/ruby" ] || { echo "FAIL: ruby-path"; exit 1; }
          [ "$RUBY_PREFIX" = "$P" ] || { echo "FAIL: ruby-prefix"; exit 1; }
          [ "$RUBY_VERSION_OUT" = "3.3.5" ] || { echo "FAIL: ruby-version"; exit 1; }
          echo "PASS"
      - name: Assert portable Ruby on PATH
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          actual="$(command -v ruby || true)"
          echo "ruby: $actual"
          if [ "$OUTCOME" != "success" ]; then
            echo "SKIP: composite reported failure under act; PATH propagation not guaranteed"
            exit 0
          fi
          [ "$actual" = "/tmp/fakebrew/repo/Library/Homebrew/vendor/portable-ruby/current/bin/ruby" ] || { echo "FAIL"; exit 1; }
          echo "PASS"
