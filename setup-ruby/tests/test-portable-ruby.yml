name: Test portable Ruby
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Ensure deprecate-master.sh helper exists
        run: |
          f="$GITHUB_WORKSPACE/../deprecate-master.sh"
          if [ ! -f "$f" ]; then
            printf '#!/bin/sh\nexit 0\n' > "$f" && chmod +x "$f" || true
          fi
      - name: Set up fake Homebrew supporting vendor-install
        run: |
          FAKE="$RUNNER_TEMP/fakehb"
          PR="$FAKE/repo/Library/Homebrew/vendor/portable-ruby/current"
          mkdir -p "$FAKE/bin" "$FAKE/repo"
          cat > "$FAKE/bin/brew" <<EOF
          #!/bin/sh
          echo "brew \$*" >> "$FAKE/brew.log"
          case "\$1" in
            --prefix) echo "$FAKE/formula-ruby" ;;
            --repository) echo "$FAKE/repo" ;;
            vendor-install)
              mkdir -p "$PR/bin"
              printf '#!/bin/sh\necho "ruby \$*" >> "$FAKE/ruby.log"\nif [ "\$1" = "-e" ]; then printf "3.4.7"; fi\n' > "$PR/bin/ruby"
              chmod +x "$PR/bin/ruby"
              ;;
            install) echo "unexpected install" >&2; exit 1 ;;
            *) exit 0 ;;
          esac
          EOF
          chmod +x "$FAKE/bin/brew"
          echo "$FAKE/bin" >> "$GITHUB_PATH"
          mkdir -p "$GITHUB_WORKSPACE/rubywd"
      # act cannot parse the action's (skipped) `uses: $/setup-homebrew` step and
      # marks the composite as failed after all real steps ran; tolerate only that.
      - id: action
        uses: .
        continue-on-error: true
        with:
          portable-ruby: "true"
          working-directory: rubywd
      - name: Assert portable Ruby used
        env:
          OUTCOME: ${{ steps.action.outcome }}
          RUBY_PATH: ${{ steps.action.outputs.ruby-path }}
          RUBY_PREFIX: ${{ steps.action.outputs.ruby-prefix }}
          RUBY_VERSION_OUT: ${{ steps.action.outputs.ruby-version }}
        run: |
          FAKE="$RUNNER_TEMP/fakehb"
          PR="$FAKE/repo/Library/Homebrew/vendor/portable-ruby/current"
          echo "outcome: $OUTCOME"
          echo "ruby-path: $RUBY_PATH"
          echo "ruby-prefix: $RUBY_PREFIX"
          echo "ruby-version: $RUBY_VERSION_OUT"
          cat "$FAKE/brew.log" || { echo "FAIL: brew never invoked"; exit 1; }
          case "$OUTCOME" in success|failure) ;; *) echo "FAIL: unexpected outcome"; exit 1 ;; esac
          grep -q "^brew vendor-install ruby" "$FAKE/brew.log" || { echo "FAIL: vendor-install not called"; exit 1; }
          if grep -q "^brew install" "$FAKE/brew.log"; then
            echo "FAIL: brew install should not have been called"; exit 1
          fi
          grep -q "^ruby -e" "$FAKE/ruby.log" || { echo "FAIL: portable ruby version not queried"; exit 1; }
          if [ "$OUTCOME" = "success" ] || [ -n "$RUBY_PATH$RUBY_PREFIX$RUBY_VERSION_OUT" ]; then
            [ "$RUBY_PATH" = "$PR/bin/ruby" ] || { echo "FAIL: ruby-path"; exit 1; }
            [ "$RUBY_PREFIX" = "$PR" ] || { echo "FAIL: ruby-prefix"; exit 1; }
            [ "$RUBY_VERSION_OUT" = "3.4.7" ] || { echo "FAIL: ruby-version"; exit 1; }
          fi
          echo "PASS"
