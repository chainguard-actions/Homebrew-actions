name: Test bundler-cache without Gemfile fails
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Set up fake Homebrew and an empty working directory
        run: |
          bash "$GITHUB_WORKSPACE/tests/fixtures/setup-fake-brew.sh" installed
          mkdir -p "$GITHUB_WORKSPACE/empty-project"
      - id: action
        uses: .
        continue-on-error: true
        with:
          working-directory: empty-project
          bundler-cache: "true"
      - name: Assert action failed after Ruby setup
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          cat /tmp/fakebrew/calls.log
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected failure when bundler-cache is set without a Gemfile"; exit 1
          fi
          # Ruby setup itself must have run (ruby -e called for version)
          grep -q '^ruby -e' /tmp/fakebrew/calls.log || { echo "FAIL: Ruby setup step did not run"; exit 1; }
          if grep -q '^bundle' /tmp/fakebrew/calls.log; then
            echo "FAIL: bundle should not have run"; exit 1
          fi
          echo "PASS"
