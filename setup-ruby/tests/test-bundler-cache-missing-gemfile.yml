name: Test bundler-cache fails without a Gemfile
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Set up fake Homebrew and empty project
        run: |
          rm -rf /tmp/fakebrew
          mkdir -p /tmp/fakebrew/bin
          cp "$GITHUB_WORKSPACE/tests/fixtures/fake-brew.sh" /tmp/fakebrew/bin/brew
          chmod +x /tmp/fakebrew/bin/brew
          : > /tmp/fakebrew/calls.log
          echo "/tmp/fakebrew/bin" >> "$GITHUB_PATH"
          if [ ! -e "$GITHUB_WORKSPACE/../deprecate-master.sh" ]; then
            { printf '#!/bin/sh\nexit 0\n' > "$GITHUB_WORKSPACE/../deprecate-master.sh" && chmod +x "$GITHUB_WORKSPACE/../deprecate-master.sh"; } || true
          fi
          mkdir -p no-gemfile-project
      - id: action
        uses: .
        continue-on-error: true
        with:
          working-directory: no-gemfile-project
          bundler-cache: "true"
      - name: Assert action failed after setting up Ruby
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          cat /tmp/fakebrew/calls.log
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected failure when bundler-cache is set without a Gemfile"; exit 1
          fi
          if ! grep -qx "brew install ruby" /tmp/fakebrew/calls.log; then
            echo "FAIL: Ruby setup should have run before the Gemfile check"; exit 1
          fi
          if grep -q "^bundle" /tmp/fakebrew/calls.log; then
            echo "FAIL: bundle should not run"; exit 1
          fi
          echo "PASS"
