name: Test bundler-cache fails without Gemfile
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Set up fake Homebrew and empty workdir
        run: |
          bash "$GITHUB_WORKSPACE/tests/fixtures/setup-fake-brew.sh" true
          echo "/tmp/fake-brew/bin" >> "$GITHUB_PATH"
          rm -rf /tmp/empty-workdir && mkdir -p /tmp/empty-workdir
      - id: action
        uses: .
        continue-on-error: true
        with:
          working-directory: /tmp/empty-workdir
          bundler-cache: "true"
      - name: Assert action failed due to missing Gemfile
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          cat /tmp/fake-brew/bundle.log
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected failure when bundler-cache is set without a Gemfile"
            exit 1
          fi
          if [ -s /tmp/fake-brew/bundle.log ]; then
            echo "FAIL: bundle should not have run"
            exit 1
          fi
          echo "PASS"
