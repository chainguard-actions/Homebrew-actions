name: Test failure when Homebrew is not available
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Prepare (deprecate stub only, no fake brew) and detect real brew
        id: detect
        run: |
          stub="$GITHUB_WORKSPACE/../deprecate-master.sh"
          if [ ! -e "$stub" ]; then
            { printf '#!/bin/sh\nexit 0\n' > "$stub" && chmod +x "$stub"; } 2>/dev/null || true
          fi
          if command -v brew >/dev/null; then
            echo "has-brew=true" >> "$GITHUB_OUTPUT"
          else
            echo "has-brew=false" >> "$GITHUB_OUTPUT"
          fi
      - id: action
        uses: .
        continue-on-error: true
      - name: Assert outcome
        env:
          HAS_BREW: ${{ steps.detect.outputs.has-brew }}
          OUTCOME: ${{ steps.action.outcome }}
          RUBY_PATH: ${{ steps.action.outputs.ruby-path }}
        run: |
          echo "has-brew: $HAS_BREW"
          echo "outcome: $OUTCOME"
          echo "ruby-path: $RUBY_PATH"
          if [ "$HAS_BREW" = "false" ]; then
            if [ "$OUTCOME" != "failure" ]; then
              echo "FAIL: expected failure without Homebrew"; exit 1
            fi
            if [ -n "$RUBY_PATH" ]; then
              echo "FAIL: ruby-path should be empty"; exit 1
            fi
            echo "PASS: failed as expected without Homebrew"
          else
            if [ "$OUTCOME" != "success" ] || [ ! -x "$RUBY_PATH" ]; then
              echo "FAIL: real Homebrew present but action did not set up Ruby"; exit 1
            fi
            echo "PASS: real Homebrew present, Ruby set up"
          fi
