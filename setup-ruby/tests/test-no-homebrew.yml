name: Test error when Homebrew is not available
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Detect whether a real brew exists
        id: detect
        run: |
          if command -v brew >/dev/null; then
            echo "has-brew=true" >> "$GITHUB_OUTPUT"
          else
            echo "has-brew=false" >> "$GITHUB_OUTPUT"
          fi
          mkdir -p /tmp/ruby-workdir
      - id: action
        if: steps.detect.outputs.has-brew == 'false'
        uses: .
        continue-on-error: true
        with:
          working-directory: /tmp/ruby-workdir
      - name: Assert action failed without Homebrew
        if: steps.detect.outputs.has-brew == 'false'
        env:
          OUTCOME: ${{ steps.action.outcome }}
          RUBY_PATH: ${{ steps.action.outputs.ruby-path }}
        run: |
          echo "outcome: $OUTCOME"
          echo "ruby-path: $RUBY_PATH"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected failure when brew is not installed"
            exit 1
          fi
          if [ -n "$RUBY_PATH" ]; then
            echo "FAIL: ruby-path should be empty"
            exit 1
          fi
          echo "PASS"
      - name: Note real brew present
        if: steps.detect.outputs.has-brew == 'true'
        run: echo "Real brew found on runner image; no-Homebrew scenario not applicable."
