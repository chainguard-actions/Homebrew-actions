name: Test bundle install with Gemfile
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Ensure deprecate-master.sh helper exists
        run: |
          f="$GITHUB_WORKSPACE/../deprecate-master.sh"
          if [ ! -f "$f" ]; then
            printf '#!/bin/sh\nexit 0\n' > "$f" && chmod +x "$f" || true
          fi
      - name: Set up fake Homebrew, Ruby and Bundler
        run: |
          FAKE="$RUNNER_TEMP/fakehb"
          mkdir -p "$FAKE/bin" "$FAKE/ruby/bin" "$FAKE/repo"
          cat > "$FAKE/ruby/bin/ruby" <<'EOF'
          #!/bin/sh
          if [ "$1" = "-e" ]; then printf '3.4.1'; exit 0; fi
          EOF
          chmod +x "$FAKE/ruby/bin/ruby"
          cat > "$FAKE/ruby/bin/bundle" <<EOF
          #!/bin/sh
          echo "bundle \$* (pwd=\$(pwd))" >> "$FAKE/bundle.log"
          case "\$1" in
            check) exit 1 ;;
            *) exit 0 ;;
          esac
          EOF
          chmod +x "$FAKE/ruby/bin/bundle"
          cat > "$FAKE/bin/brew" <<EOF
          #!/bin/sh
          case "\$1" in
            --prefix) echo "$FAKE/ruby" ;;
            --repository) echo "$FAKE/repo" ;;
            *) exit 0 ;;
          esac
          EOF
          chmod +x "$FAKE/bin/brew"
          echo "$FAKE/bin" >> "$GITHUB_PATH"
          mkdir -p "$GITHUB_WORKSPACE/rubywd"
          echo 'source "https://rubygems.org"' > "$GITHUB_WORKSPACE/rubywd/Gemfile"
      # act cannot parse the action's (skipped) `uses: $/setup-homebrew` step and
      # marks the composite as failed after all real steps ran; tolerate only that.
      - id: action
        uses: .
        continue-on-error: true
        with:
          working-directory: rubywd
      - name: Assert bundle check then bundle install ran in working directory
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          case "$OUTCOME" in success|failure) ;; *) echo "FAIL: unexpected outcome"; exit 1 ;; esac
          LOG="$RUNNER_TEMP/fakehb/bundle.log"
          cat "$LOG" || { echo "FAIL: bundle never invoked"; exit 1; }
          grep -q "^bundle check" "$LOG" || { echo "FAIL: bundle check not run"; exit 1; }
          grep -q "^bundle install --jobs 4 --retry 3" "$LOG" || { echo "FAIL: bundle install not run"; exit 1; }
          grep -q "pwd=.*/rubywd)" "$LOG" || { echo "FAIL: bundle not run in working directory"; exit 1; }
          if grep -q "^bundle config" "$LOG"; then
            echo "FAIL: bundle config should not run without bundler-cache"; exit 1
          fi
          echo "PASS"
