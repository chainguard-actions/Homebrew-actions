name: Test bundle install with Gemfile in working-directory
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Set up fake Homebrew and a Gemfile
        run: |
          bash "$GITHUB_WORKSPACE/tests/fixtures/setup-fake-brew.sh" true
          echo "/tmp/fake-brew/bin" >> "$GITHUB_PATH"
          # also expose fake bundle in case GITHUB_PATH from composite steps is not propagated
          echo "/tmp/fake-brew/opt/ruby/bin" >> "$GITHUB_PATH"
          mkdir -p /tmp/gem-workdir
          printf 'source "https://rubygems.org"\n' > /tmp/gem-workdir/Gemfile
      # act reports a parse error for the (skipped) `uses: $/setup-homebrew` step in
      # action.yml after all real steps succeed, so tolerate the step outcome and
      # assert on the actual behaviour/outputs below.
      - id: action
        uses: .
        continue-on-error: true
        with:
          working-directory: /tmp/gem-workdir
      - name: Assert bundle check and install ran in working-directory
        env:
          OUTCOME: ${{ steps.action.outcome }}
          RUBY_VERSION_OUT: ${{ steps.action.outputs.ruby-version }}
        run: |
          echo "outcome: $OUTCOME"
          echo "ruby-version: $RUBY_VERSION_OUT"
          cat /tmp/fake-brew/bundle.log
          fail=0
          case "$OUTCOME" in success|failure) ;; *) echo "FAIL: unexpected outcome"; fail=1 ;; esac
          grep -q "^bundle check (pwd=/tmp/gem-workdir)" /tmp/fake-brew/bundle.log || { echo "FAIL: bundle check not run in workdir"; fail=1; }
          grep -q "^bundle install --jobs 4 --retry 3 (pwd=/tmp/gem-workdir)" /tmp/fake-brew/bundle.log || { echo "FAIL: bundle install not run"; fail=1; }
          if grep -q "bundle config" /tmp/fake-brew/bundle.log; then echo "FAIL: bundle config should not run without bundler-cache"; fail=1; fi
          [ "$RUBY_VERSION_OUT" = "3.4.7" ] || { echo "FAIL: ruby-version"; fail=1; }
          [ "$fail" = 0 ] || exit 1
          echo "PASS"
