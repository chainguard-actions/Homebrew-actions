name: Test bundle install runs in working-directory with Gemfile
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Set up fake Homebrew and project
        run: |
          rm -rf /tmp/fakebrew
          mkdir -p /tmp/fakebrew/bin
          cp "$GITHUB_WORKSPACE/tests/fixtures/fake-brew.sh" /tmp/fakebrew/bin/brew
          chmod +x /tmp/fakebrew/bin/brew
          : > /tmp/fakebrew/calls.log
          echo "/tmp/fakebrew/bin" >> "$GITHUB_PATH"
          if [ ! -e "$GITHUB_WORKSPACE/../deprecate-master.sh" ]; then
            { printf '#!/bin/sh\nexit 0\n' > "$GITHUB_WORKSPACE/../deprecate-master.sh" && chmod +x "$GITHUB_WORKSPACE/../deprecate-master.sh"; } || true
          fi
          mkdir -p ruby-project
          printf 'source "https://rubygems.org"\n' > ruby-project/Gemfile
      # act cannot parse the (skipped) `uses: $/setup-homebrew` step and marks the
      # composite failed after its inner steps succeed; assert side effects instead.
      - id: action
        uses: .
        continue-on-error: true
        with:
          working-directory: ruby-project
      - name: Assert bundle check and install ran in working directory
        env:
          OUTCOME: ${{ steps.action.outcome }}
          RUBY_PATH: ${{ steps.action.outputs.ruby-path }}
        run: |
          echo "outcome: $OUTCOME"
          echo "ruby-path: $RUBY_PATH"
          cat /tmp/fakebrew/calls.log
          if [ "$OUTCOME" != "success" ] && [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: unexpected outcome '$OUTCOME'"; exit 1
          fi
          if [ "$RUBY_PATH" != "/tmp/fakebrew/opt/ruby/bin/ruby" ]; then
            echo "FAIL: unexpected ruby-path"; exit 1
          fi
          if ! grep -E "^bundle check .*pwd=.*/ruby-project\)$" /tmp/fakebrew/calls.log; then
            echo "FAIL: bundle check not run in ruby-project"; exit 1
          fi
          if ! grep -E "^bundle install --jobs 4 --retry 3 .*pwd=.*/ruby-project\)$" /tmp/fakebrew/calls.log; then
            echo "FAIL: bundle install not run in ruby-project"; exit 1
          fi
          if grep -q "bundle config" /tmp/fakebrew/calls.log; then
            echo "FAIL: bundle config should not run without bundler-cache"; exit 1
          fi
          echo "PASS"
