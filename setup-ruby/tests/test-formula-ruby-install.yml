name: Test formula Ruby is installed when missing
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Set up fake Homebrew
        run: |
          rm -rf /tmp/fakebrew
          mkdir -p /tmp/fakebrew/bin
          cp "$GITHUB_WORKSPACE/tests/fixtures/fake-brew.sh" /tmp/fakebrew/bin/brew
          chmod +x /tmp/fakebrew/bin/brew
          : > /tmp/fakebrew/calls.log
          echo "/tmp/fakebrew/bin" >> "$GITHUB_PATH"
          if [ ! -e "$GITHUB_WORKSPACE/../deprecate-master.sh" ]; then
            { printf '#!/bin/sh\nexit 0\n' > "$GITHUB_WORKSPACE/../deprecate-master.sh" && chmod +x "$GITHUB_WORKSPACE/../deprecate-master.sh"; } || true
          fi
      # act cannot parse the (skipped) `uses: $/setup-homebrew` step and marks the
      # whole composite as failed after all inner steps succeed, so tolerate the
      # step-level outcome and assert on the real side effects instead.
      - id: action
        uses: .
        continue-on-error: true
      - name: Assert outputs
        env:
          OUTCOME: ${{ steps.action.outcome }}
          RUBY_PATH: ${{ steps.action.outputs.ruby-path }}
          RUBY_PREFIX: ${{ steps.action.outputs.ruby-prefix }}
          RUBY_VERSION: ${{ steps.action.outputs.ruby-version }}
        run: |
          echo "outcome: $OUTCOME"
          echo "ruby-path: $RUBY_PATH"
          echo "ruby-prefix: $RUBY_PREFIX"
          echo "ruby-version: $RUBY_VERSION"
          cat /tmp/fakebrew/calls.log
          if [ "$OUTCOME" != "success" ] && [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: unexpected outcome '$OUTCOME'"; exit 1
          fi
          if [ "$RUBY_PATH" != "/tmp/fakebrew/opt/ruby/bin/ruby" ]; then
            echo "FAIL: unexpected ruby-path"; exit 1
          fi
          if [ "$RUBY_PREFIX" != "/tmp/fakebrew/opt/ruby" ]; then
            echo "FAIL: unexpected ruby-prefix"; exit 1
          fi
          if [ "$RUBY_VERSION" != "3.4.1" ]; then
            echo "FAIL: unexpected ruby-version"; exit 1
          fi
          if ! grep -qx "brew install ruby" /tmp/fakebrew/calls.log; then
            echo "FAIL: expected 'brew install ruby' to be called"; exit 1
          fi
          if grep -q "vendor-install" /tmp/fakebrew/calls.log; then
            echo "FAIL: vendor-install should not be called"; exit 1
          fi
          if [ ! -x /tmp/fakebrew/opt/ruby/bin/ruby ]; then
            echo "FAIL: ruby executable not installed"; exit 1
          fi
          echo "PASS"
