name: Test valid definition on a non-pull_request event
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        continue-on-error: true
        with:
          def: |
            - label: new formula
              status: added
              path: Formula/.+
            - label: legacy
              path: Formula/.+@.+
              except:
                - Formula/python@3.8
            - label: bump-formula-pr
              pr_body_content: Created with `brew bump-formula-pr`
      - name: Assert action failed gracefully (no pull_request in event payload)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          # workflow_dispatch payload has no pull_request; the action cannot
          # resolve a PR number (and the sentinel repo is not resolvable),
          # so it must report failure via setFailed rather than be skipped.
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected failure, got '$OUTCOME'"
            exit 1
          fi
          echo "PASS"
