name: Test valid JSON definition
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        continue-on-error: true
        with:
          def: |
            [
              {"label": "bottle unneeded", "content": "bottle :unneeded"},
              {"label": "missing license", "missing_content": "license \"[^\"]+\""},
              {"label": "bump-formula-pr", "pr_body_content": "Created with `brew bump-formula-pr`"}
            ]
      - name: Assert action ran (no PR in workflow_dispatch event / sentinel repo)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "success" ]; then
            echo "PASS: action completed"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (no pull_request in event / sentinel repo)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
