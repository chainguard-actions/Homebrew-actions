name: Test valid JSON definition with PR event payload
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Create fake pull_request event payload
        run: |
          echo '{"pull_request":{"number":1}}' > "$RUNNER_TEMP/pr-event.json"
          cat "$RUNNER_TEMP/pr-event.json"
      - id: action
        uses: .
        continue-on-error: true
        env:
          GITHUB_EVENT_PATH: ${{ runner.temp }}/pr-event.json
        with:
          def: |
            [
              {"label": "bump-formula-pr", "pr_body_content": "Created with `brew bump-formula-pr`"},
              {"label": "missing license", "missing_content": "license \"[^\"]+\""}
            ]
      - name: Assert action ran (or failed gracefully on sentinel repo)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "success" ]; then
            echo "PASS: action succeeded"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (sentinel repo is not resolvable)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
