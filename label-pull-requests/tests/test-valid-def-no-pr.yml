name: Test valid definition outside a pull_request event
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      # Valid definition passes linting; the action then needs a pull_request
      # event payload and repo-scoped API calls, which are impossible under the
      # harness (workflow_dispatch event + sentinel repository). It must fail
      # gracefully rather than succeed silently or be skipped.
      - id: action
        uses: .
        continue-on-error: true
        with:
          def: |
            - label: new formula
              status: added
              path: Formula/.+
            - label: legacy
              path: Formula/.+@.+
              except:
                - Formula/python@3.8
                - Formula/python@3.9
            - label: bump-formula-pr
              pr_body_content: Created with `brew bump-formula-pr`
      - name: Assert action ran and failed gracefully
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "success" ]; then
            echo "PASS: action completed (no labels to change)"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (no pull_request payload / sentinel repo)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
