name: Test basic install
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Set up fake brew
        run: bash "$GITHUB_WORKSPACE/tests/fixtures/setup-fake-brew.sh"
      - id: action
        uses: .
        with:
          install: hello jq
      - name: Assert prefix output
        env:
          ACTUAL: ${{ steps.action.outputs.prefix }}
        run: |
          echo "actual: $ACTUAL"
          if [ "$ACTUAL" != "/tmp/fakebrew/prefix" ]; then
            echo "FAIL: expected /tmp/fakebrew/prefix"
            exit 1
          fi
          echo "PASS"
      - name: Assert cache-prefix output
        env:
          ACTUAL: ${{ steps.action.outputs.cache-prefix }}
        run: |
          echo "actual: $ACTUAL"
          . /etc/os-release
          EXPECTED="${ID:-linux}-${VERSION_ID:-unknown}-$(uname -m)"
          echo "expected: $EXPECTED"
          if [ "$ACTUAL" != "$EXPECTED" ]; then
            echo "FAIL"
            exit 1
          fi
          echo "PASS"
      - name: Assert cache-key output
        env:
          ACTUAL: ${{ steps.action.outputs.cache-key }}
        run: |
          echo "actual: $ACTUAL"
          EXPECTED="$(printf 'hello 2.12.1 0\njq 1.7.1 1\n' | sha256sum | cut -d' ' -f1)"
          echo "expected: $EXPECTED"
          if [ "$ACTUAL" != "$EXPECTED" ]; then
            echo "FAIL"
            exit 1
          fi
          echo "PASS"
      - name: Assert brew install was invoked
        run: |
          cat /tmp/fakebrew/calls.log
          if ! grep -qx 'brew install --formula hello jq' /tmp/fakebrew/calls.log; then
            echo "FAIL: brew install --formula hello jq not called"
            exit 1
          fi
          echo "PASS"
