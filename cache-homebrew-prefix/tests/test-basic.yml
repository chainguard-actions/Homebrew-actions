name: Test basic install
on:
  workflow_dispatch:
env:
  HOMEBREW_NO_AUTO_UPDATE: "1"
  HOMEBREW_NO_ANALYTICS: "1"
  HOMEBREW_NO_INSTALL_CLEANUP: "1"
  HOMEBREW_NO_ENV_HINTS: "1"
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Set up Homebrew (if missing)
        shell: bash
        run: |
          set -euo pipefail
          if ! command -v brew >/dev/null 2>&1; then
            if [ ! -x /home/linuxbrew/.linuxbrew/bin/brew ]; then
              mkdir -p /home/linuxbrew/.linuxbrew/bin
              git clone --depth=1 https://github.com/Homebrew/brew /home/linuxbrew/.linuxbrew/Homebrew
              ln -sf ../Homebrew/bin/brew /home/linuxbrew/.linuxbrew/bin/brew
            fi
            export PATH="/home/linuxbrew/.linuxbrew/bin:/home/linuxbrew/.linuxbrew/sbin:$PATH"
            echo "/home/linuxbrew/.linuxbrew/sbin" >> "$GITHUB_PATH"
            echo "/home/linuxbrew/.linuxbrew/bin" >> "$GITHUB_PATH"
          fi
          brew config
          # Populate the API cache used by version-hash.rb
          brew info --formula hello >/dev/null
          brew list --formula || true
      - id: action
        uses: .
        with:
          install: hello
      - name: Assert outputs
        shell: bash
        env:
          PREFIX: ${{ steps.action.outputs.prefix }}
          CACHE_PREFIX: ${{ steps.action.outputs.cache-prefix }}
          CACHE_KEY: ${{ steps.action.outputs.cache-key }}
        run: |
          echo "prefix: $PREFIX"
          echo "cache-prefix: $CACHE_PREFIX"
          echo "cache-key: $CACHE_KEY"
          if [ "$PREFIX" != "$(brew --prefix)" ]; then
            echo "FAIL: prefix does not match brew --prefix"
            exit 1
          fi
          . /etc/os-release
          expected="${ID:-linux}-${VERSION_ID:-unknown}-$(uname -m)"
          if [ "$CACHE_PREFIX" != "$expected" ]; then
            echo "FAIL: expected cache-prefix '$expected'"
            exit 1
          fi
          if ! echo "$CACHE_KEY" | grep -qE '^[0-9a-f]{64}$'; then
            echo "FAIL: cache-key is not a sha256 hex digest"
            exit 1
          fi
          if ! brew list --formula hello >/dev/null 2>&1; then
            echo "FAIL: hello formula not installed"
            exit 1
          fi
          echo "PASS"
