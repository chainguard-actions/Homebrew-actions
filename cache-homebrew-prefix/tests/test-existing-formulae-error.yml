name: Test existing formulae without uninstall fails
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Set up fake brew with a preinstalled formula
        run: bash "$GITHUB_WORKSPACE/tests/fixtures/setup-fake-brew.sh" wget
      - id: action
        uses: .
        continue-on-error: true
        with:
          install: hello
      - name: Assert action failed without cleanup
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          cat "$FAKE_BREW_ROOT/calls.log"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected failure when formulae already installed"
            exit 1
          fi
          if grep -q '^test-bot' "$FAKE_BREW_ROOT/calls.log"; then
            echo "FAIL: cleanup should not run when uninstall=false"
            exit 1
          fi
          if grep -q '^install' "$FAKE_BREW_ROOT/calls.log"; then
            echo "FAIL: brew install should not have run"
            exit 1
          fi
          echo "PASS"
