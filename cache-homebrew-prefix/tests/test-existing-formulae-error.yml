name: Test existing formulae without uninstall fails
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Set up fake Homebrew with a preinstalled formula
        run: bash "$GITHUB_WORKSPACE/tests/fixtures/setup-fake-brew.sh" oldpkg
      - id: action
        uses: .
        continue-on-error: true
        with:
          install: jq
          workflow-key: act-existing-error
      - name: Assert action failed before installing
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          echo "--- brew log ---"; cat "$FAKE_BREW_ROOT/log"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected failure when formulae already installed"; exit 1
          fi
          if grep -q "^brew install" "$FAKE_BREW_ROOT/log"; then
            echo "FAIL: brew install should not have run"; exit 1
          fi
          if grep -q "^brew test-bot" "$FAKE_BREW_ROOT/log"; then
            echo "FAIL: cleanup should not run without uninstall=true"; exit 1
          fi
          echo "PASS"
