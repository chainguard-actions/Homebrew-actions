name: Test error on existing formulae without uninstall
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Set up fake Homebrew with pre-installed formulae
        run: |
          bash "$GITHUB_WORKSPACE/tests/fixtures/setup-fake-brew.sh"
          printf 'oldformula\n' > /tmp/fakebrew/installed
      - id: action
        uses: .
        continue-on-error: true
        with:
          install: jq
      - name: Assert action failed without installing
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          cat /tmp/fakebrew/calls.log
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected failure"
            exit 1
          fi
          if grep -q '^install ' /tmp/fakebrew/calls.log; then
            echo "FAIL: install should not have run"
            exit 1
          fi
          if grep -q '^test-bot' /tmp/fakebrew/calls.log; then
            echo "FAIL: cleanup should not have run"
            exit 1
          fi
          echo "PASS"
