name: Test no packages fails
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Set up fake Homebrew
        run: bash "$GITHUB_WORKSPACE/tests/fixtures/setup-fake-brew.sh"
      - id: action
        uses: .
        continue-on-error: true
        with:
          workflow-key: act-no-packages
      - name: Assert action failed
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          echo "--- brew log ---"; cat "$FAKE_BREW_ROOT/log"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected failure with no packages"; exit 1
          fi
          if grep -q "^brew install" "$FAKE_BREW_ROOT/log"; then
            echo "FAIL: brew install should not have run"; exit 1
          fi
          echo "PASS"
