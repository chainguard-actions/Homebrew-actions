name: Test no packages fails
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Set up fake Homebrew
        run: bash "$GITHUB_WORKSPACE/tests/fixtures/setup-fake-brew.sh"
      - id: action
        uses: .
        continue-on-error: true
      - name: Assert action failed
        env:
          OUTCOME: ${{ steps.action.outcome }}
          KEY: ${{ steps.action.outputs.cache-key }}
        run: |
          echo "outcome: $OUTCOME key: $KEY"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected failure"
            exit 1
          fi
          if [ -n "$KEY" ]; then
            echo "FAIL: cache-key should be empty"
            exit 1
          fi
          if grep -q '^install ' /tmp/fakebrew/calls.log; then
            echo "FAIL: install should not run"
            exit 1
          fi
          echo "PASS"
