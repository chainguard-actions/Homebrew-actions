name: Test missing Brewfile fails
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Ensure no Brewfile exists
        run: |
          if [ -f Brewfile ]; then
            echo "Brewfile unexpectedly present in workspace root"
            exit 1
          fi
      - id: action
        uses: .
        continue-on-error: true
        with:
          brewfile: "true"
      - name: Assert action failed
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected failure when Brewfile is missing"
            exit 1
          fi
          echo "PASS"
