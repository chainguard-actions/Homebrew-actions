name: Test brewfile and install together fails
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Set up fake Homebrew and Brewfile
        run: |
          bash "$GITHUB_WORKSPACE/tests/fixtures/setup-fake-brew.sh"
          printf 'brew "jq"\n' > "$GITHUB_WORKSPACE/Brewfile"
      - id: action
        uses: .
        continue-on-error: true
        with:
          brewfile: "true"
          install: wget
          workflow-key: act-conflict
      - name: Assert action failed without installing
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          echo "--- brew log ---"; cat "$FAKE_BREW_ROOT/log"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected failure when both brewfile and install set"; exit 1
          fi
          if grep -qx "brew bundle --file Brewfile" "$FAKE_BREW_ROOT/log" \
             || grep -q "^brew install" "$FAKE_BREW_ROOT/log"; then
            echo "FAIL: nothing should have been installed"; exit 1
          fi
          echo "PASS"
      - name: Clean up Brewfile
        if: always()
        run: rm -f "$GITHUB_WORKSPACE/Brewfile"
