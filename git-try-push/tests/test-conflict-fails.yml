name: Test rebase conflict fails and aborts
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Set up conflicting diverged remote
        run: |
          set -e
          rm -rf /tmp/gtp && mkdir -p /tmp/gtp
          git init --bare -q /tmp/gtp/remote.git
          git -C /tmp/gtp/remote.git symbolic-ref HEAD refs/heads/main
          git init -q /tmp/gtp/work
          cd /tmp/gtp/work
          git checkout -q -b main
          git config user.email "test@example.com"
          git config user.name "Test User"
          echo one > file.txt
          git add file.txt
          git commit -q -m "initial"
          git remote add origin /tmp/gtp/remote.git
          git push -q origin main
          git clone -q /tmp/gtp/remote.git /tmp/gtp/other
          cd /tmp/gtp/other
          git config user.email "other@example.com"
          git config user.name "Other User"
          echo other > file.txt
          git commit -q -am "other conflicting commit"
          git push -q origin main
          git rev-parse HEAD > /tmp/gtp/other-sha
          cd /tmp/gtp/work
          echo local > file.txt
          git commit -q -am "local commit"
          git rev-parse HEAD > /tmp/gtp/local-sha
      - id: action
        uses: .
        continue-on-error: true
        with:
          directory: /tmp/gtp/work
          branch: main
          tries: "2"
      - name: Assert action failed, rebase aborted, remote untouched
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected failure on rebase conflict"
            exit 1
          fi
          GITDIR=$(git -C /tmp/gtp/work rev-parse --absolute-git-dir)
          if [ -d "$GITDIR/rebase-merge" ] || [ -d "$GITDIR/rebase-apply" ]; then
            echo "FAIL: rebase was left in progress"
            exit 1
          fi
          LOCAL=$(git -C /tmp/gtp/work rev-parse HEAD)
          if [ "$LOCAL" != "$(cat /tmp/gtp/local-sha)" ]; then
            echo "FAIL: local commit not restored after abort ($LOCAL)"
            exit 1
          fi
          REMOTE=$(git -C /tmp/gtp/remote.git rev-parse refs/heads/main)
          if [ "$REMOTE" != "$(cat /tmp/gtp/other-sha)" ]; then
            echo "FAIL: remote should be unchanged ($REMOTE)"
            exit 1
          fi
          echo "PASS"
