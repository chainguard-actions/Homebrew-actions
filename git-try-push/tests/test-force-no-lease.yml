name: Test force push without lease
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Set up rewritten local history
        run: |
          set -e
          T="$RUNNER_TEMP/gtp"
          rm -rf "$T"; mkdir -p "$T"
          git init --bare -b main "$T/remote.git"
          git clone "$T/remote.git" "$T/work"
          cd "$T/work"
          git config user.email "test@example.com"
          git config user.name "Test User"
          git symbolic-ref HEAD refs/heads/main
          echo one > a.txt; git add a.txt; git commit -m one
          echo two > b.txt; git add b.txt; git commit -m two
          git push origin main
          # Rewrite history: amend the tip so the push is non-fast-forward
          echo rewritten > b.txt; git add b.txt; git commit --amend -m two-rewritten
          git rev-parse HEAD > "$T/expected"
          git switch -c scratch
      - id: action
        uses: .
        with:
          directory: ${{ runner.temp }}/gtp/work
          branch: main
          tries: "2"
          force: "true"
          no_lease: "true"
      - name: Assert remote main force-updated to rewritten commit
        run: |
          T="$RUNNER_TEMP/gtp"
          EXPECTED="$(cat "$T/expected")"
          ACTUAL="$(git --git-dir="$T/remote.git" rev-parse refs/heads/main)"
          echo "expected: $EXPECTED actual: $ACTUAL"
          if [ "$EXPECTED" != "$ACTUAL" ]; then
            echo "FAIL: remote main not force-updated"
            exit 1
          fi
          SUBJ="$(git --git-dir="$T/remote.git" log -1 --format=%s main)"
          if [ "$SUBJ" != "two-rewritten" ]; then
            echo "FAIL: unexpected subject '$SUBJ'"
            exit 1
          fi
          echo "PASS"
