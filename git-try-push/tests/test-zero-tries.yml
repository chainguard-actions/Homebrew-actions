name: Test zero tries does not push
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Set up local bare remote and clone
        run: |
          set -e
          ROOT="$RUNNER_TEMP/gtp-zero"
          rm -rf "$ROOT"; mkdir -p "$ROOT"
          git init --bare "$ROOT/remote.git"
          git init "$ROOT/clone"
          cd "$ROOT/clone"
          git config user.email test@example.com
          git config user.name "Test User"
          git checkout -b main
          echo one > file.txt
          git add file.txt
          git commit -m "initial"
          git remote add origin "$ROOT/remote.git"
          git checkout -b work
          echo "ROOT=$ROOT" >> "$GITHUB_ENV"
      - id: action
        uses: .
        with:
          directory: ${{ env.ROOT }}/clone
          branch: main
          tries: "0"
          token: dummy-value-for-extraheader
      - name: Assert nothing pushed and token header configured
        run: |
          if git --git-dir="$ROOT/remote.git" rev-parse --verify -q refs/heads/main; then
            echo "FAIL: main should not have been pushed"
            exit 1
          fi
          HDR="$(git -C "$ROOT/clone" config --local --get http.https://github.com/.extraheader || true)"
          EXPECTED="AUTHORIZATION: basic $(printf 'x-access-token:dummy-value-for-extraheader' | base64 -w0)"
          if [ "$HDR" != "$EXPECTED" ]; then
            echo "FAIL: extraheader not configured as expected"
            exit 1
          fi
          CUR="$(git -C "$ROOT/clone" rev-parse --abbrev-ref HEAD)"
          echo "current branch: $CUR"
          if [ "$CUR" != "work" ]; then
            echo "FAIL: branch should be unchanged"
            exit 1
          fi
          echo "PASS"
