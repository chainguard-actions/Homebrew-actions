name: Test zero tries does nothing
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Set up local repo and bare remote
        run: |
          set -e
          rm -rf /tmp/gtp && mkdir -p /tmp/gtp
          git init --bare /tmp/gtp/remote.git
          git init /tmp/gtp/local
          cd /tmp/gtp/local
          git config user.email "test@example.com"
          git config user.name "Test User"
          git checkout -b main
          echo one > a.txt && git add a.txt && git commit -m "first"
          git remote add origin /tmp/gtp/remote.git
          git checkout -b work
      - id: action
        uses: .
        with:
          directory: /tmp/gtp/local
          tries: "0"
      - name: Assert nothing pushed and branch unchanged
        run: |
          if git --git-dir=/tmp/gtp/remote.git rev-parse --verify -q refs/heads/main; then
            echo "FAIL: main should not have been pushed with tries=0"
            exit 1
          fi
          CUR="$(git -C /tmp/gtp/local rev-parse --abbrev-ref HEAD)"
          echo "current branch: $CUR"
          if [ "$CUR" != "work" ]; then
            echo "FAIL: branch should be unchanged"
            exit 1
          fi
          echo "PASS"
