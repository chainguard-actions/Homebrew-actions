name: Test rebase conflict fails
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Set up conflicting local and remote histories
        run: |
          set -e
          T="$RUNNER_TEMP/gtp"
          rm -rf "$T"; mkdir -p "$T"
          git init --bare -b main "$T/remote.git"
          git clone "$T/remote.git" "$T/work"
          cd "$T/work"
          git config user.email "test@example.com"
          git config user.name "Test User"
          git symbolic-ref HEAD refs/heads/main
          echo base > file.txt; git add file.txt; git commit -m base
          git push origin main
          git clone "$T/remote.git" "$T/other"
          cd "$T/other"
          git config user.email "other@example.com"
          git config user.name "Other User"
          git checkout main
          echo upstream > file.txt; git commit -am upstream
          git push origin main
          git rev-parse HEAD > "$T/upstream-sha"
          cd "$T/work"
          echo local > file.txt; git commit -am local-conflict
          git rev-parse HEAD > "$T/local-sha"
          git switch -c scratch
      - id: action
        uses: .
        continue-on-error: true
        with:
          directory: ${{ runner.temp }}/gtp/work
          branch: main
          tries: "2"
      - name: Assert action failed and rebase was aborted
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          T="$RUNNER_TEMP/gtp"
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected failure on rebase conflict"
            exit 1
          fi
          GITDIR="$(git -C "$T/work" rev-parse --absolute-git-dir)"
          if [ -d "$GITDIR/rebase-merge" ] || [ -d "$GITDIR/rebase-apply" ]; then
            echo "FAIL: rebase was left in progress"
            exit 1
          fi
          LOCAL="$(git -C "$T/work" rev-parse main)"
          if [ "$LOCAL" != "$(cat "$T/local-sha")" ]; then
            echo "FAIL: local main should be restored to local commit"
            exit 1
          fi
          REMOTE="$(git --git-dir="$T/remote.git" rev-parse main)"
          if [ "$REMOTE" != "$(cat "$T/upstream-sha")" ]; then
            echo "FAIL: remote main should be unchanged"
            exit 1
          fi
          echo "PASS"
