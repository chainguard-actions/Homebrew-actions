name: Test failure when remote is unreachable
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Set up clone with a broken remote
        run: |
          set -e
          ROOT="$RUNNER_TEMP/gtp-fail"
          rm -rf "$ROOT"; mkdir -p "$ROOT"
          git init "$ROOT/clone"
          cd "$ROOT/clone"
          git config user.email test@example.com
          git config user.name "Test User"
          git checkout -b main
          echo one > file.txt
          git add file.txt
          git commit -m "initial"
          git remote add origin "$ROOT/does-not-exist.git"
          git checkout -b work
          echo "ROOT=$ROOT" >> "$GITHUB_ENV"
      - id: action
        uses: .
        continue-on-error: true
        with:
          directory: ${{ env.ROOT }}/clone
          branch: main
          tries: "1"
      - name: Assert action failed
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected failure when remote is unreachable"
            exit 1
          fi
          echo "PASS"
