name: Test basic push
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Set up local bare remote and clone
        run: |
          set -e
          export GIT_AUTHOR_NAME="Test User" GIT_AUTHOR_EMAIL="test@example.com"
          export GIT_COMMITTER_NAME="Test User" GIT_COMMITTER_EMAIL="test@example.com"
          ROOT="$RUNNER_TEMP/gtp-basic"
          rm -rf "$ROOT"; mkdir -p "$ROOT"
          git init --bare "$ROOT/remote.git"
          git init "$ROOT/clone"
          cd "$ROOT/clone"
          git config user.email test@example.com
          git config user.name "Test User"
          git checkout -b main
          echo one > file.txt
          git add file.txt
          git commit -m "initial"
          git remote add origin "$ROOT/remote.git"
          git push origin main
          echo two >> file.txt
          git commit -am "second"
          git rev-parse HEAD > "$ROOT/expected"
          git checkout -b work
          echo "ROOT=$ROOT" >> "$GITHUB_ENV"
      - id: action
        uses: .
        with:
          directory: ${{ env.ROOT }}/clone
          branch: main
          tries: "3"
      - name: Assert remote main updated
        run: |
          EXPECTED="$(cat "$ROOT/expected")"
          ACTUAL="$(git --git-dir="$ROOT/remote.git" rev-parse refs/heads/main)"
          echo "expected: $EXPECTED actual: $ACTUAL"
          if [ "$ACTUAL" != "$EXPECTED" ]; then
            echo "FAIL: remote main not updated"
            exit 1
          fi
          CUR="$(git -C "$ROOT/clone" rev-parse --abbrev-ref HEAD)"
          echo "current branch: $CUR"
          if [ "$CUR" != "work" ]; then
            echo "FAIL: expected to be back on 'work'"
            exit 1
          fi
          echo "PASS"
