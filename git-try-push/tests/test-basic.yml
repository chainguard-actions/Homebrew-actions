name: Test basic push
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Set up local bare remote and working clone
        run: |
          set -e
          T="$RUNNER_TEMP/gtp"
          rm -rf "$T"; mkdir -p "$T"
          git init --bare -b main "$T/remote.git"
          git clone "$T/remote.git" "$T/work"
          cd "$T/work"
          git config user.email "test@example.com"
          git config user.name "Test User"
          git symbolic-ref HEAD refs/heads/main
          echo one > a.txt; git add a.txt; git commit -m one
          git push origin main
          echo two > b.txt; git add b.txt; git commit -m two
          git rev-parse HEAD > "$T/expected"
          git switch -c scratch
      - id: action
        uses: .
        with:
          directory: ${{ runner.temp }}/gtp/work
          branch: main
          tries: "3"
      - name: Assert remote main updated and previous branch restored
        run: |
          T="$RUNNER_TEMP/gtp"
          EXPECTED="$(cat "$T/expected")"
          ACTUAL="$(git --git-dir="$T/remote.git" rev-parse refs/heads/main)"
          echo "expected: $EXPECTED actual: $ACTUAL"
          if [ "$EXPECTED" != "$ACTUAL" ]; then
            echo "FAIL: remote main not updated"
            exit 1
          fi
          CUR="$(git -C "$T/work" rev-parse --abbrev-ref HEAD)"
          echo "current branch: $CUR"
          if [ "$CUR" != "scratch" ]; then
            echo "FAIL: expected to be back on scratch"
            exit 1
          fi
          echo "PASS"
