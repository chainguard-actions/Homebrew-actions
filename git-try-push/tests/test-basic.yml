name: Test basic push
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Set up local bare remote and work clone
        run: |
          set -e
          rm -rf /tmp/gtp && mkdir -p /tmp/gtp
          git init --bare -q /tmp/gtp/remote.git
          git -C /tmp/gtp/remote.git symbolic-ref HEAD refs/heads/main
          git init -q /tmp/gtp/work
          cd /tmp/gtp/work
          git checkout -q -b main
          git config user.email "test@example.com"
          git config user.name "Test User"
          echo one > file.txt
          git add file.txt
          git commit -q -m "initial"
          git remote add origin /tmp/gtp/remote.git
          git push -q origin main
          echo two >> file.txt
          git commit -q -am "second"
      - id: action
        uses: .
        with:
          directory: /tmp/gtp/work
          branch: main
          tries: "3"
      - name: Assert remote main matches local commit
        run: |
          LOCAL=$(git -C /tmp/gtp/work rev-parse main)
          REMOTE=$(git -C /tmp/gtp/remote.git rev-parse refs/heads/main)
          echo "local: $LOCAL"
          echo "remote: $REMOTE"
          if [ "$LOCAL" != "$REMOTE" ]; then
            echo "FAIL: remote main was not updated"
            exit 1
          fi
          CUR=$(git -C /tmp/gtp/work rev-parse --abbrev-ref HEAD)
          echo "current branch: $CUR"
          if [ "$CUR" != "main" ]; then
            echo "FAIL: expected to be back on main"
            exit 1
          fi
          echo "PASS"
