name: Test basic push
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Set up local repo and bare remote
        run: |
          set -e
          rm -rf /tmp/gtp-basic
          mkdir -p /tmp/gtp-basic
          cd /tmp/gtp-basic
          git init --bare -b main remote.git
          git init -b main local
          cd local
          git config user.email "test@example.com"
          git config user.name "Test User"
          echo one > file.txt
          git add file.txt
          git commit -m "first"
          git remote add origin /tmp/gtp-basic/remote.git
          git push origin main
          echo two >> file.txt
          git commit -am "second"
          git rev-parse HEAD > /tmp/gtp-basic/expected
      - id: action
        uses: .
        with:
          directory: /tmp/gtp-basic/local
          tries: "3"
      - name: Assert remote has new commit
        run: |
          EXPECTED="$(cat /tmp/gtp-basic/expected)"
          ACTUAL="$(git --git-dir=/tmp/gtp-basic/remote.git rev-parse main)"
          echo "expected: $EXPECTED"
          echo "actual: $ACTUAL"
          if [ "$EXPECTED" != "$ACTUAL" ]; then
            echo "FAIL: remote main does not match local commit"
            exit 1
          fi
          echo "PASS"
