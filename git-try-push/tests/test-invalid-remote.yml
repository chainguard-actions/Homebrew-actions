name: Test invalid remote fails
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Set up local repo with no valid remote
        run: |
          set -e
          rm -rf /tmp/gtp-invalid
          mkdir -p /tmp/gtp-invalid
          cd /tmp/gtp-invalid
          git init -b main local
          cd local
          git config user.email "test@example.com"
          git config user.name "Test User"
          echo one > file.txt
          git add file.txt
          git commit -m "first"
          git remote add origin /tmp/gtp-invalid/does-not-exist.git
      - id: action
        uses: .
        continue-on-error: true
        with:
          directory: /tmp/gtp-invalid/local
          tries: "1"
      - name: Assert action failed
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected failure when remote is unreachable"
            exit 1
          fi
          echo "PASS"
