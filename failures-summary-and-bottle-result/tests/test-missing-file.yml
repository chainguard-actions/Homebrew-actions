name: Test missing result file is a no-op
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Ensure deprecate-master.sh helper exists next to the action
        run: |
          helper="$(dirname "$GITHUB_WORKSPACE")/deprecate-master.sh"
          if [ ! -x "$helper" ]; then
            printf '#!/bin/sh\nexit 0\n' > "$helper"
            chmod +x "$helper"
          fi
      - id: action
        uses: .
        continue-on-error: true
        with:
          workdir: ${{ runner.temp }}/does-not-exist
          result_path: nothing/here.txt
      - name: Assert action succeeded
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "success" ]; then
            echo "FAIL: expected success when result file is missing"
            exit 1
          fi
          echo "PASS"
