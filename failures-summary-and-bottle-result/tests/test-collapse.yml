name: Test collapse with custom heading
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Create result file
        run: |
          mkdir -p "$GITHUB_WORKSPACE/bottles"
          echo "COLLAPSE_MARKER_CONTENT" > "$GITHUB_WORKSPACE/bottles/steps_output.txt"
      - name: Start step-summary watcher (act truncates the summary file per step)
        run: |
          rm -f /tmp/summary-snapshot.md
          SUMMARY_FILE="$GITHUB_STEP_SUMMARY"
          export SUMMARY_FILE
          setsid nohup bash -c '
            while :; do
              if grep -qF "### " "$SUMMARY_FILE" 2>/dev/null; then
                cp "$SUMMARY_FILE" /tmp/summary-snapshot.tmp && mv /tmp/summary-snapshot.tmp /tmp/summary-snapshot.md
              fi
              sleep 0.01
            done' > /dev/null 2>&1 < /dev/null &
          echo $! > /tmp/summary-watcher.pid
          sleep 0.2
      - id: action
        uses: .
        with:
          collapse: 'true'
          step_name: Collapsed Heading Marker
      - name: Assert result file removed
        run: |
          if [ -e "$GITHUB_WORKSPACE/bottles/steps_output.txt" ]; then
            echo "FAIL: result file should have been removed"
            exit 1
          fi
          echo "PASS"
      - name: Assert collapsed summary
        run: |
          kill "$(cat /tmp/summary-watcher.pid)" 2>/dev/null || true
          S=/tmp/summary-snapshot.md
          echo "--- captured summary ---"
          cat "$S" || { echo "FAIL: no summary captured"; exit 1; }
          echo "------------------------"
          grep -qF '### Collapsed Heading Marker' "$S" || { echo "FAIL: heading missing"; exit 1; }
          grep -qF '<details><summary>Details</summary>' "$S" || { echo "FAIL: details open tag missing"; exit 1; }
          grep -qF 'COLLAPSE_MARKER_CONTENT' "$S" || { echo "FAIL: content missing"; exit 1; }
          grep -qF '</details>' "$S" || { echo "FAIL: details close tag missing"; exit 1; }
          echo "PASS"
