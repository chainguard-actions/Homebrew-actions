name: Test basic usage
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Create result file
        run: |
          mkdir -p "$GITHUB_WORKSPACE/bottles"
          printf 'line one\n\033[31mred text\033[0m\n' > "$GITHUB_WORKSPACE/bottles/steps_output.txt"
      - id: action
        uses: .
      - name: Assert result file consumed
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "success" ]; then echo "FAIL: action failed"; exit 1; fi
          if [ -e "$GITHUB_WORKSPACE/bottles/steps_output.txt" ]; then
            echo "FAIL: result file should have been removed"
            exit 1
          fi
          echo "PASS"
