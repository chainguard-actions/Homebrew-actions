name: Test missing runner_name fails
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        continue-on-error: true
        with:
          github_token: ${{ github.token }}
          runner_name: ""
      - name: Assert action failed due to missing required input
        env:
          FOUND: ${{ steps.action.outputs.runner-found }}
          IDLE: ${{ steps.action.outputs.runner-idle }}
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          echo "runner-found: $FOUND"
          echo "runner-idle: $IDLE"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected failure when runner_name is empty"
            exit 1
          fi
          if [ -n "$FOUND" ] || [ -n "$IDLE" ]; then
            echo "FAIL: outputs should not be set"
            exit 1
          fi
          echo "PASS"
