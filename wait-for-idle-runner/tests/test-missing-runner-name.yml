name: Test missing runner_name
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        continue-on-error: true
        with:
          github_token: ${{ github.token }}
          runner_name: ""
      - name: Assert action failed on missing required input
        env:
          OUTCOME: ${{ steps.action.outcome }}
          FOUND: ${{ steps.action.outputs.runner-found }}
        run: |
          echo "outcome: $OUTCOME"
          echo "runner-found: $FOUND"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected failure when runner_name is empty"
            exit 1
          fi
          if [ -n "$FOUND" ]; then
            echo "FAIL: no output expected on input validation failure"
            exit 1
          fi
          echo "PASS"
