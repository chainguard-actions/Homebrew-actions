name: Test missing github_token fails
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        continue-on-error: true
        with:
          github_token: ""
          runner_name: some-runner
      - name: Assert action failed
        env:
          OUTCOME: ${{ steps.action.outcome }}
          FOUND: ${{ steps.action.outputs.runner-found }}
        run: |
          echo "outcome: $OUTCOME"
          echo "runner-found: $FOUND"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected failure when github_token is missing"
            exit 1
          fi
          if [ -n "$FOUND" ]; then
            echo "FAIL: runner-found should not be set"
            exit 1
          fi
          echo "PASS"
