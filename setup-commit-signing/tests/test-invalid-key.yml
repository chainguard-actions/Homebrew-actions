name: Test invalid signing key fails
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Prepare environment
        run: |
          if [ ! -f "$GITHUB_WORKSPACE/../deprecate-master.sh" ]; then
            printf '#!/bin/bash\necho "stub deprecate-master: $*"\n' > "$GITHUB_WORKSPACE/../deprecate-master.sh"
            chmod +x "$GITHUB_WORKSPACE/../deprecate-master.sh"
          fi
          git config --global user.email "test@example.com"
          git config --global user.name "Test User"
          git config --global --unset user.signingkey || true
      - id: action
        uses: .
        continue-on-error: true
        with:
          signing_key: "this-is-not-a-valid-ssh-key"
      - name: Assert action failed and did not configure signing
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected failure for invalid key"
            exit 1
          fi
          KEY="$(git config --global user.signingkey || true)"
          echo "signingkey: '$KEY'"
          if [ -n "$KEY" ]; then
            echo "FAIL: signingkey should not be set"
            exit 1
          fi
          echo "PASS"
