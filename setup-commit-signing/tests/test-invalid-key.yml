name: Test invalid signing key fails
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Set git identity
        run: |
          git config --global user.email "test@example.com"
          git config --global user.name "Test User"
          git config --global --unset gpg.format || true
      - id: action
        uses: .
        continue-on-error: true
        with:
          signing_key: "this-is-not-a-valid-ssh-private-key"
      - name: Assert action failed and did not configure signing
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected failure for invalid key"
            exit 1
          fi
          fmt="$(git config --global gpg.format || true)"
          echo "gpg.format: '$fmt'"
          if [ "$fmt" = "ssh" ]; then
            echo "FAIL: signing should not be configured on invalid key"
            exit 1
          fi
          echo "PASS"
