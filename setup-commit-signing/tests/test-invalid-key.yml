name: Test invalid signing key fails
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Prepare environment
        run: |
          STUB="$GITHUB_WORKSPACE/../deprecate-master.sh"
          if [ ! -e "$STUB" ]; then
            printf '#!/bin/bash\nexit 0\n' > "$STUB" || printf '#!/bin/bash\nexit 0\n' | sudo tee "$STUB" >/dev/null
            chmod +x "$STUB" 2>/dev/null || sudo chmod +x "$STUB"
          fi
          git config --global user.email "test@example.com"
          git config --global user.name "Test User"
          git config --global --unset gpg.format || true
          git config --global --unset commit.gpgsign || true
      - id: action
        uses: .
        continue-on-error: true
        with:
          signing_key: "this-is-not-a-valid-ssh-private-key"
      - name: Assert action failed and did not enable signing
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected failure for invalid key"
            exit 1
          fi
          gs="$(git config --global commit.gpgsign || true)"
          echo "commit.gpgsign: '$gs'"
          if [ "$gs" = "true" ]; then
            echo "FAIL: signing should not be enabled after invalid key"
            exit 1
          fi
          echo "PASS"
