name: Test invalid signing key fails
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Provide sibling deprecate-master.sh (lives in the Homebrew/actions monorepo root)
        run: |
          target="$GITHUB_WORKSPACE/../deprecate-master.sh"
          if [ ! -f "$target" ]; then
            printf '#!/bin/bash\nexit 0\n' > /tmp/deprecate-master.sh
            chmod +x /tmp/deprecate-master.sh
            cp /tmp/deprecate-master.sh "$target" 2>/dev/null || sudo cp /tmp/deprecate-master.sh "$target"
          fi
      - name: Configure git identity
        run: |
          git config --global user.name "Test User"
          git config --global user.email "test@example.com"
          git config --global --unset user.signingkey || true
      - id: action
        uses: .
        continue-on-error: true
        with:
          signing_key: "this-is-not-a-valid-ssh-private-key"
      - name: Assert action failed and did not configure signing
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected failure with invalid key"
            exit 1
          fi
          skey="$(git config --global user.signingkey || true)"
          echo "signingkey: '$skey'"
          if [ -n "$skey" ]; then
            echo "FAIL: signingkey should not be set"
            exit 1
          fi
          echo "PASS"
