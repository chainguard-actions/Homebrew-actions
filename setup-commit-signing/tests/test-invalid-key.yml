name: Test invalid signing key
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Provide sibling deprecate-master.sh (lives in parent monorepo upstream)
        run: |
          target="$GITHUB_WORKSPACE/../deprecate-master.sh"
          if [ ! -f "$target" ]; then
            printf '#!/bin/bash\necho "deprecate-master stub: $*"\n' > "$target" 2>/dev/null \
              || printf '#!/bin/bash\necho "deprecate-master stub: $*"\n' | sudo tee "$target" >/dev/null
            chmod +x "$target" 2>/dev/null || sudo chmod +x "$target"
          fi
      - name: Configure git identity
        run: |
          git config --global user.email "bad@example.com"
          git config --global user.name "Bad User"
          git config --global --unset user.signingkey || true
      - id: action
        uses: .
        continue-on-error: true
        with:
          signing_key: "this-is-not-a-valid-ssh-private-key"
      - name: Assert action failed and did not configure signing key
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected failure for invalid key"
            exit 1
          fi
          if git config --global user.signingkey >/dev/null; then
            echo "FAIL: signingkey should not be set"
            exit 1
          fi
          echo "PASS"
