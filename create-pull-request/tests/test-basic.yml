name: Test basic pull request creation
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        continue-on-error: true
        with:
          head: act-harness-test-branch
          base: main
      - name: Assert action ran (PR created, or failed gracefully on the sentinel repo)
        env:
          RESULT: ${{ steps.action.outputs.number }}
          NODE_ID: ${{ steps.action.outputs.node_id }}
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          echo "number: $RESULT"
          echo "node_id: $NODE_ID"
          if [ "$OUTCOME" = "success" ]; then
            if ! echo "$RESULT" | grep -qE '^[0-9]+$'; then
              echo "FAIL: action succeeded but number output is not numeric"
              exit 1
            fi
            if [ -z "$NODE_ID" ]; then
              echo "FAIL: action succeeded but node_id output is empty"
              exit 1
            fi
            echo "PASS: created PR #$RESULT"
          elif [ "$OUTCOME" = "failure" ]; then
            if [ -n "$RESULT" ]; then
              echo "FAIL: action failed but still set number output"
              exit 1
            fi
            echo "PASS: action failed gracefully (sentinel repo is not resolvable)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
