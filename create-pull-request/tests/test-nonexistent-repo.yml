name: Test nonexistent repository fails
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        continue-on-error: true
        with:
          repository: actionchain-harness-nonexistent-owner/does-not-exist-repo
          head: some-branch
          base: main
      - name: Assert action failed
        env:
          NUMBER: ${{ steps.action.outputs.number }}
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          echo "number: $NUMBER"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected failure for nonexistent repository"
            exit 1
          fi
          if [ -n "$NUMBER" ]; then
            echo "FAIL: number output should not be set"
            exit 1
          fi
          echo "PASS"
