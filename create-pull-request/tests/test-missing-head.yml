name: Test missing required head input fails
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        continue-on-error: true
        with:
          base: main
      - name: Assert action failed without outputs
        env:
          NUMBER: ${{ steps.action.outputs.number }}
          NODE_ID: ${{ steps.action.outputs.node_id }}
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          echo "number: $NUMBER"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected failure when head is missing, got '$OUTCOME'"
            exit 1
          fi
          if [ -n "$NUMBER" ] || [ -n "$NODE_ID" ]; then
            echo "FAIL: outputs should not be set on failure"
            exit 1
          fi
          echo "PASS"
