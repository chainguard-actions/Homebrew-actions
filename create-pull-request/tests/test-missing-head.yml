name: Test missing required head input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        continue-on-error: true
        with:
          base: main
      - name: Assert action failed because head is required
        env:
          RESULT: ${{ steps.action.outputs.number }}
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          echo "number: $RESULT"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected failure when head is missing, got '$OUTCOME'"
            exit 1
          fi
          if [ -n "$RESULT" ]; then
            echo "FAIL: number output should not be set"
            exit 1
          fi
          echo "PASS"
