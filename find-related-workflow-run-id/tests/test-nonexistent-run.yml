name: Test nonexistent run ID in a real public repository
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        continue-on-error: true
        with:
          run-id: "1"
          workflow-name: CI
          repository: Homebrew/brew
      - name: Assert action failed and set no output
        env:
          RESULT: ${{ steps.action.outputs.workflow-run-id }}
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          echo "result: $RESULT"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected failure for nonexistent run id, got '$OUTCOME'"
            exit 1
          fi
          if [ -n "$RESULT" ]; then
            echo "FAIL: expected no output, got '$RESULT'"
            exit 1
          fi
          if [ -n "$workflow_run_id" ]; then
            echo "FAIL: env.workflow_run_id should not be set, got '$workflow_run_id'"
            exit 1
          fi
          echo "PASS"
