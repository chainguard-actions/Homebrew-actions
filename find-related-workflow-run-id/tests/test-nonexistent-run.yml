name: Test nonexistent run id on a public repository
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        continue-on-error: true
        with:
          run-id: "1"
          workflow-name: definitely-not-a-real-workflow-name
          repository: Homebrew/brew
      - name: Assert action failed and set no output
        env:
          RESULT: ${{ steps.action.outputs.workflow-run-id }}
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          echo "result: $RESULT"
          echo "env workflow_run_id: ${workflow_run_id:-<unset>}"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected failure for a nonexistent run / workflow"
            exit 1
          fi
          if [ -n "$RESULT" ]; then
            echo "FAIL: output should be empty on failure"
            exit 1
          fi
          if [ -n "${workflow_run_id:-}" ]; then
            echo "FAIL: workflow_run_id env should not be exported on failure"
            exit 1
          fi
          echo "PASS"
