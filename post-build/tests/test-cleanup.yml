name: Test post cleanup removes bottles directory
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Install fake brew on PATH
        run: |
          mkdir -p "$RUNNER_TEMP/fakebin"
          cat > "$RUNNER_TEMP/fakebin/brew" <<'EOF'
          #!/bin/bash
          echo "brew $* HOMEBREW_DEVELOPER=${HOMEBREW_DEVELOPER:-}" >> /tmp/fake-brew-calls.log
          exit 0
          EOF
          chmod +x "$RUNNER_TEMP/fakebin/brew"
          rm -f /tmp/fake-brew-calls.log
          echo "$RUNNER_TEMP/fakebin" >> "$GITHUB_PATH"
      - name: Prepare bottles and logs directories
        run: |
          B="$GITHUB_WORKSPACE/test-bottles-cleanup"
          L="$GITHUB_WORKSPACE/test-logs-cleanup"
          rm -rf "$B" "$L"
          mkdir -p "$B" "$L"
          echo '{}' > "$B/bar--2.0.x86_64_linux.bottle.json"
          echo 'log' > "$L/build.log"
      - id: action
        uses: .
        continue-on-error: true
        with:
          bottles-directory: ${{ github.workspace }}/test-bottles-cleanup
          logs-directory: ${{ github.workspace }}/test-logs-cleanup
          runner: cleanup-runner
          cleanup: "true"
          upload-bottles: "false"
      - name: Assert cleanup ran
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          echo "brew calls:"
          cat /tmp/fake-brew-calls.log || true
          if ! grep -q "brew test-bot --only-cleanup-after HOMEBREW_DEVELOPER=1" /tmp/fake-brew-calls.log; then
            echo "FAIL: expected 'brew test-bot --only-cleanup-after' with HOMEBREW_DEVELOPER=1"
            exit 1
          fi
          if [ -e "$GITHUB_WORKSPACE/test-bottles-cleanup" ]; then
            echo "FAIL: bottles directory should have been removed"
            exit 1
          fi
          echo "PASS"
