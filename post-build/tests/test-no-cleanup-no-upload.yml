name: Test post-build without cleanup or bottle upload
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Prepare bottles and logs directories
        run: |
          rm -rf bottles-test logs-test
          mkdir -p bottles-test/failed bottles-test/logs bottles-test/home logs-test
          touch bottles-test/foo.json bottles-test/bar.json bottles-test/foo.bottle.tar.gz
          touch bottles-test/failed/baz.json
          touch bottles-test/tested-dependents-Linux.txt
          echo "log line" > logs-test/test.log
          echo "steps summary" > bottles-test/steps_output.txt
      - id: action
        uses: .
        continue-on-error: true
        with:
          bottles-directory: bottles-test
          logs-directory: logs-test
          runner: ubuntu-test
          cleanup: "false"
          upload-bottles: "false"
      - name: Assert results
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          ls -laR bottles-test || true
          if [ "$OUTCOME" != "success" ] && [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
          # cleanup=false: the bottles directory must never be removed
          if [ ! -d bottles-test ]; then
            echo "FAIL: bottles directory was removed although cleanup=false"
            exit 1
          fi
          # bottle JSON files must never be deleted
          for f in foo.json bar.json foo.bottle.tar.gz; do
            if [ ! -f "bottles-test/$f" ]; then
              echo "FAIL: bottles-test/$f was deleted"
              exit 1
            fi
          done
          if [ "$OUTCOME" = "success" ]; then
            for d in failed logs home; do
              if [ -e "bottles-test/$d" ]; then
                echo "FAIL: bottles-test/$d should have been deleted"
                exit 1
              fi
            done
            if ls bottles-test/tested-dependents-*.txt >/dev/null 2>&1; then
              echo "FAIL: tested-dependents lists should have been deleted"
              exit 1
            fi
          fi
          # If the delete step ran (failed/ gone), all unneeded files must be gone too
          if [ ! -e bottles-test/failed ]; then
            if [ -e bottles-test/logs ] || [ -e bottles-test/home ] \
               || ls bottles-test/tested-dependents-*.txt >/dev/null 2>&1; then
              echo "FAIL: delete step only partially removed unneeded files"
              exit 1
            fi
          fi
          echo "PASS"
